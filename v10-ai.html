<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIYANINI SOCK LAB V10 AI</title><style>body{margin:0;background:#eeeae3;color:#282621;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:16px 18px;background:#fff;border-bottom:1px solid #ddd6cc;font-weight:800;letter-spacing:2px}.wrap{max-width:1100px;margin:auto;padding:14px}.layout{display:grid;grid-template-columns:280px 1fr;gap:12px}.card{background:#fff;border:1px solid #ddd6cc;border-radius:18px;padding:14px}.scene{min-height:600px;border-radius:15px;background:radial-gradient(circle at 50% 32%,#fff,#e4e0d9);display:flex;align-items:center;justify-content:center;overflow:hidden}.sock{position:relative;width:300px;height:570px;filter:drop-shadow(22px 24px 18px #0003);transform:rotateY(-15deg)}.cuff,.leg,.foot{position:absolute;background:var(--sock,#eee7da);border:1px solid #c4bbae;box-shadow:inset -22px 0 30px #00000012,inset 10px 0 18px #ffffff55}.cuff{left:70px;top:18px;width:155px;height:75px;border-radius:28px 28px 12px 12px}.leg{left:70px;top:75px;width:155px;height:330px;border-radius:13px}.foot{left:67px;top:385px;width:205px;height:145px;border-radius:12px 85px 80px 22px;transform:skewY(-6deg)}.pattern{position:absolute;left:86px;top:145px;width:125px;text-align:center;font-size:68px;color:#8a6d58;z-index:4}.anti{position:absolute;left:95px;top:425px;width:125px;text-align:center;font-size:18px;letter-spacing:4px;color:var(--grip,#ef6f91);z-index:5}.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px}button{border:1px solid #d6cec3;background:#faf9f6;border-radius:10px;padding:10px 7px;cursor:pointer}button.active,button.primary{background:#282621;color:white}input[type=color]{width:100%;height:38px;border:0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.status{margin-top:10px;background:#f5f1eb;border-radius:10px;padding:11px;font-size:12px;line-height:1.7}.result{margin-top:12px;display:none}.result img{width:100%;border-radius:14px}.small{font-size:11px;color:#777;line-height:1.6}@media(max-width:850px){.layout{grid-template-columns:1fr}}</style></head><body><header>TIYANINI <span style="font-size:10px;color:#999">SOCK LAB V10 · AI REAL KNIT</span></header><main class="wrap"><div class="layout"><aside class="card"><h2>设计</h2><p class="small">先设计，再点击生成真实针织袜。AI会根据这些参数生成商品摄影效果。</p><h3>袜子颜色</h3><input id="sockColor" type="color" value="#eee7da"><h3>图案</h3><div class="controls" id="patterns"></div><h3>图案颜色</h3><input id="patColor" type="color" value="#8a6d58"><h3>防滑</h3><div class="controls" id="grips"></div><h3>防滑颜色</h3><input id="gripColor" type="color" value="#ef6f91"><h3>上传设计参考图</h3><input id="upload" type="file" accept="image/*"></aside><section class="card"><h2>真实针织袜</h2><div class="scene"><div class="sock" id="sock"><div class="cuff"></div><div class="leg"></div><div class="foot"></div><div class="pattern" id="pattern">☀</div><div class="anti" id="anti">• • •</div></div></div><div class="actions"><button id="front">正面</button><button id="angle" class="active">45°</button><button id="side">侧面</button><button id="sole">袜底</button><button class="primary" id="render">✨ 生成真实针织袜</button></div><div class="status" id="status">后端：已连接配置。点击“生成真实针织袜”开始 AI 渲染。</div><div class="result" id="result"><h3>AI 成品图</h3><img id="resultImg"><a id="download" download="tiyanini-real-knit-sock.png">保存图片</a></div></section></div></main><script>const API='https://tiyanini-sock-lab-1.onrender.com/api/generate';const $=s=>document.querySelector(s);let pat='sun',gr='dots',ref=null;const patterns=[['☀','太阳'],['☁','云朵'],['✦','星星'],['〰','海浪'],['✿','花朵'],['♡','爱心'],['▤','条纹'],['•','波点'],['🎀','蝴蝶结'],['🐚','贝壳'],['🍋','柠檬'],['🍒','樱桃'],['','无图案']];const grips=[['•','dots'],['✦','stars'],['✿','flowers'],['♡','hearts'],['◆','geometric'],['〰','waves'],['TIYANINI','TIYANINI'],['','none']];function makeButtons(id,arr,cb){let box=$(id);arr.forEach((x,i)=>{let b=document.createElement('button');b.textContent=x[0]||x[1];if(i===0)b.className='active';b.onclick=()=>{box.querySelectorAll('button').forEach(z=>z.classList.remove('active'));b.classList.add('active');cb(x)};box.appendChild(b)})}makeButtons('#patterns',patterns,x=>{pat=x[0]||'none';$('#pattern').textContent=x[0]||''});makeButtons('#grips',grips,x=>{gr=x[1];$('#anti').textContent=x[0]?x[0]+' '+x[0]+' '+x[0]:''});$('#sockColor').oninput=e=>document.documentElement.style.setProperty('--sock',e.target.value);$('#patColor').oninput=e=>$('#pattern').style.color=e.target.value;$('#gripColor').oninput=e=>document.documentElement.style.setProperty('--grip',e.target.value);$('#front').onclick=()=>$('#sock').style.transform='rotateY(0deg)';$('#angle').onclick=()=>$('#sock').style.transform='rotateY(-15deg)';$('#side').onclick=()=>$('#sock').style.transform='rotateY(70deg)';$('#sole').onclick=()=>$('#sock').style.transform='rotateY(180deg) rotateX(7deg)';$('#upload').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>ref=r.result;r.readAsDataURL(f)};$('#render').onclick=async()=>{let s=$('#status');s.textContent='⏳ 正在生成真实针织袜，请稍等…';$('#render').disabled=true;try{let view=document.querySelector('.sock').style.transform.includes('70deg')?'side':document.querySelector('.sock').style.transform.includes('180deg')?'sole':document.querySelector('.sock').style.transform.includes('0deg')?'front':'45-degree';let body={sockColor:$('#sockColor').value,pattern:pat,patternColor:$('#patColor').value,grip:gr,gripColor:$('#gripColor').value,sockType:'mid-calf Pilates grip sock',style:'premium feminine minimal fashion',view,referenceImage:ref};let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw new Error(d.error||'生成失败');$('#resultImg').src=d.image;$('#download').href=d.image;$('#result').style.display='block';s.textContent='✅ AI 真实针织袜已生成。';}catch(e){s.textContent='❌ '+e.message+'。如果是首次部署，请等待 Render 完成部署后再试。';}finally{$('#render').disabled=false}};</script></body></html>

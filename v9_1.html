<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIYANINI SOCK LAB V9.1</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f0ea;color:#292621;font:14px -apple-system,BlinkMacSystemFont,sans-serif}header{background:#fff;padding:16px;font-weight:800;letter-spacing:2px}.app{max-width:1100px;margin:auto;padding:12px;display:grid;grid-template-columns:250px 1fr 250px;gap:12px}.card{background:#fff;border:1px solid #ddd6cc;border-radius:18px;padding:14px}.scene{height:560px;border-radius:15px;background:radial-gradient(circle,#fff,#e9e4dc);display:flex;align-items:center;justify-content:center;perspective:900px;overflow:hidden}.sock{width:230px;height:480px;position:relative;transform-style:preserve-3d;transform:rotateY(-20deg);transition:.5s;filter:drop-shadow(18px 20px 12px #0002)}.part{position:absolute;background:var(--c,#eee7da);border:1px solid #c5bdb2;box-shadow:inset -18px 0 28px #0001}.cuff{left:55px;top:10px;width:120px;height:70px;border-radius:25px 25px 8px 8px}.leg{left:55px;top:60px;width:120px;height:280px;border-radius:10px}.foot{left:53px;top:320px;width:165px;height:120px;border-radius:10px 65px 65px 20px;transform:skewY(-5deg)}.pat{position:absolute;z-index:3;left:65px;top:135px;width:100px;text-align:center;font-size:60px}.grip{position:absolute;z-index:4;left:65px;top:365px;width:130px;text-align:center;color:var(--g,#ef6f91);font-size:18px;letter-spacing:4px}button{width:100%;margin:4px 0;padding:9px;border:1px solid #d8d0c5;background:#faf9f6;border-radius:10px}button.active,button.primary{background:#292621;color:white}.colors{display:flex;flex-wrap:wrap}.sw{width:25px;height:25px;border-radius:50%;margin:3px;box-shadow:0 0 0 1px #bbb;cursor:pointer}.tools{display:flex;gap:6px;flex-wrap:wrap}.tools button{width:auto}.status{background:#f5f1eb;border-radius:10px;padding:10px;margin-top:8px;font-size:12px;line-height:1.6}input[type=color]{width:100%;height:36px}input[type=range]{width:100%}@media(max-width:850px){.app{grid-template-columns:1fr}.stage{order:-1}}</style><body><header>TIYANINI <small>SOCK LAB V9.1 · 3D DESIGN STUDIO</small></header><main class="app"><aside class="card"><b>① 袜子设计</b><h4>袜型</h4><div id="types"></div><h4>风格</h4><div id="styles"></div><h4>袜身颜色（自定义）</h4><input id="c" type="color" value="#eee7da"><div class="colors" id="colors"></div><h4>图案</h4><div id="patterns"></div><h4>自定义图案</h4><input id="file" type="file" accept="image/*"></aside><section class="card stage"><h3 id="title">中筒 · 极简</h3><div class="scene"><div class="sock" id="sock"><i class="part cuff"></i><i class="part leg"></i><i class="part foot"></i><div class="pat" id="pat">☀</div><div class="grip" id="grip">• • •</div></div></div><div class="tools"><button id="front">正面</button><button id="angle">45°</button><button id="side">侧面</button><button id="sole">袜底</button><button class="primary" id="render">✨ 生成商品效果预览</button></div><div class="status" id="msg">实时立体预览：修改任意选项都会立即反映到袜子上。</div></section><aside class="card"><b>② 防滑与细节</b><h4>防滑图案</h4><div id="grips"></div><h4>防滑颜色（自定义）</h4><input id="g" type="color" value="#ef6f91"><div class="colors" id="gcolors"></div><h4>防滑大小</h4><input id="gs" type="range" min="8" max="28" value="16"><h4>防滑文字</h4><input id="txt" value="TIYANINI" style="width:100%;padding:9px;border:1px solid #ddd;border-radius:9px"><h4>图案颜色（自定义）</h4><input id="pc" type="color" value="#8a6d58"><h4>图案大小</h4><input id="ps" type="range" min="30" max="90" value="60"><div class="status">V9.1 不需要 API 就能设计和查看立体效果。AI 摄影级真实商品图需要以后接入安全后端。</div></aside></main><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];function buttons(id,a,fn){let b=$(id);a.forEach((x,i)=>{let q=document.createElement('button');q.textContent=x;q.onclick=()=>{b.querySelectorAll('button').forEach(z=>z.classList.remove('active'));q.classList.add('active');fn(x)};b.append(q);if(!i)q.classList.add('active')})}buttons('#types',['中筒','短筒','船袜','五指袜','堆堆袜','芭蕾袜','高筒','运动袜'],update);buttons('#styles',['极简','海滩','运动','芭蕾','复古','甜酷','学院','法式','街头','自然','艺术','度假'],update);buttons('#patterns',['☀','☁','✦','〰','✿','♡','▤','•','🎀','🐚','🍋','🍒','☁✦','TIYANINI','无图案'],x=>{$('#pat').textContent=x});buttons('#grips',['• • •','✦ ✦','✿ ✿','♡ ♡','◆ ◆','〰 〰','TIYANINI',''],x=>{$('#grip').textContent=x});const cs=['#f7f3ea','#eee7da','#e3d4be','#c9b79c','#aebba6','#7f927b','#8db0c9','#e5b3a5','#c9878b','#b6a5d6','#8a6d58','#22262a','#fff','#f2c94c','#e8a33a','#e76f51'];const gs=['#ef6f91','#22262a','#fff','#8f83c9','#76aeaa','#9eb98c','#d8a54a','#b97b62'];function sw(id,a,input){a.forEach(x=>{let s=document.createElement('i');s.className='sw';s.style.background=x;s.onclick=()=>{input.value=x;input.dispatchEvent(new Event('input'))};$(id).append(s)})}sw('#colors',cs,$('#c'));sw('#gcolors',gs,$('#g'));function update(){document.documentElement.style.setProperty('--c',$('#c').value);document.documentElement.style.setProperty('--g',$('#g').value);$('#grip').style.fontSize=$('#gs').value+'px';$('#pat').style.fontSize=$('#ps').value+'px';$('#pat').style.color=$('#pc').value;$('#title').textContent=$('#types .active').textContent+' · '+$('#styles .active').textContent;$('#grip').textContent=$('#grips button.active').textContent||'';if($('#grips button.active').textContent==='TIYANINI')$('#grip').textContent=$('#txt').value||'TIYANINI')}['c','g','gs','ps','pc','txt'].forEach(id=>$('#'+id).oninput=update);$('#front').onclick=()=>$('#sock').style.transform='rotateY(0deg)';$('#angle').onclick=()=>$('#sock').style.transform='rotateY(-35deg) rotateX(2deg)';$('#side').onclick=()=>$('#sock').style.transform='rotateY(75deg)';$('#sole').onclick=()=>{$('#sock').style.transform='rotateY(180deg) rotateX(8deg)';$('#msg').textContent='袜底视图：检查防滑图案的颜色、大小和覆盖面积。'};$('#render').onclick=()=>$('#msg').textContent='✨ 商品效果预览已生成：当前袜型、颜色、图案、防滑和立体光影均已应用。';$('#file').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{$('#pat').textContent='';$('#pat').style.background=`url(${r.result}) center/contain no-repeat`;$('#pat').style.height='120px'};r.readAsDataURL(f)};update();</script></body></html>

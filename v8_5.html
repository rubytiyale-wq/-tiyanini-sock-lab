<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIYANINI SOCK LAB V8.5</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f0eb;color:#292722;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#fff;border-bottom:1px solid #ddd7ce;padding:16px;font-weight:800;letter-spacing:2px;position:sticky;top:0;z-index:5}.sub{font-size:10px;color:#888;letter-spacing:0}.wrap{max-width:1080px;margin:auto;padding:10px;display:grid;grid-template-columns:250px 1fr 250px;gap:10px}.panel,.stage{background:#fff;border:1px solid #ddd7ce;border-radius:18px;padding:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}h2{font-size:15px;margin:2px 0 13px}h3{font-size:11px;color:#777;margin:15px 0 8px}button{border:1px solid #d8d1c8;background:#faf9f6;border-radius:10px;padding:9px 6px;font-size:12px;color:#292722}button.active{background:#292722;color:#fff}.colors{display:flex;gap:8px;flex-wrap:wrap}.sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ccc;cursor:pointer}.preview{height:590px;background:linear-gradient(145deg,#faf9f6,#eee9e1);border-radius:15px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.label{position:absolute;top:12px;left:12px;font-size:9px;letter-spacing:1px;color:#8b857d}.sock{width:330px;height:560px;filter:drop-shadow(12px 18px 14px #0002)}svg{width:100%;height:100%}.toolbar{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:10px}.primary{background:#292722;color:#fff;border-color:#292722}.status{background:#f7f4ef;border-radius:10px;padding:10px;font-size:11px;line-height:1.7}.hint{font-size:10px;color:#888;line-height:1.6}@media(max-width:850px){.wrap{grid-template-columns:1fr}.stage{order:-1}.preview{height:560px}}
</style></head><body><header>TIYANINI <span class="sub">SOCK LAB V8.5 · 商品效果图生成</span></header><div class="wrap"><div class="panel"><h2>设计参数</h2><h3>袜型</h3><div class="grid" id="types"><button class="active" data-t="mid">中筒袜</button><button data-t="ankle">短袜</button><button data-t="no">船袜</button><button data-t="toe">五指袜</button><button data-t="slouch">堆堆袜</button><button data-t="ballet">芭蕾袜</button></div><h3>风格</h3><div class="grid" id="styles"><button class="active">海滩</button><button>运动</button><button>芭蕾</button><button>极简</button><button>复古</button><button>甜酷</button><button>自然</button><button>艺术</button></div><h3>袜子颜色</h3><div class="colors" id="sockColors"><i class="sw" data-c="#efe7da" style="background:#efe7da"></i><i class="sw" data-c="#d5c0a1" style="background:#d5c0a1"></i><i class="sw" data-c="#aebaa5" style="background:#aebaa5"></i><i class="sw" data-c="#8db0c9" style="background:#8db0c9"></i><i class="sw" data-c="#e5b3a5" style="background:#e5b3a5"></i><i class="sw" data-c="#8a6d58" style="background:#8a6d58"></i><i class="sw" data-c="#22262a" style="background:#22262a"></i><i class="sw" data-c="#fff" style="background:#fff"></i></div><h3>主图案</h3><div class="grid" id="patterns"><button class="active" data-p="sun">太阳</button><button data-p="cloud">云朵</button><button data-p="star">星星</button><button data-p="wave">海浪</button><button data-p="heart">爱心</button><button data-p="none">无图案</button></div></div><div class="stage"><h2 id="title">中筒袜 · 海滩风</h2><div class="preview"><div class="label">PRODUCT MOCKUP</div><div class="sock"><svg viewBox="0 0 360 560"><defs><linearGradient id="fabric" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".08"/><stop offset=".35" stop-color="#fff" stop-opacity=".04"/><stop offset=".75" stop-color="#000" stop-opacity=".02"/><stop offset="1" stop-color="#000" stop-opacity=".13"/></linearGradient><linearGradient id="soleShade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-opacity=".03"/><stop offset="1" stop-opacity=".16"/></linearGradient><clipPath id="clip"><path id="path" d="M113 30 Q180 7 247 30 L247 333 Q248 371 278 405 L319 453 Q338 475 324 503 Q309 531 271 529 L117 529 Q76 528 60 501 Q47 474 69 451 L110 409 Q114 404 113 382 Z"/></clipPath></defs><path id="base" d="M113 30 Q180 7 247 30 L247 333 Q248 371 278 405 L319 453 Q338 475 324 503 Q309 531 271 529 L117 529 Q76 528 60 501 Q47 474 69 451 L110 409 Q114 404 113 382 Z" fill="var(--sock,#efe7da)" stroke="#cfc7bc" stroke-width="2"/><g clip-path="url(#clip)"><rect x="50" y="10" width="280" height="525" fill="url(#fabric)"/><g id="pattern"></g><g id="grip"></g><g opacity=".16" stroke="#777" stroke-width="1"><path d="M120 55V350M130 45V390M140 42V400M150 40V405M160 38V410M170 37V415M180 37V420M190 37V415M200 38V410M210 40V405M220 42V400M230 45V390M240 55V350"/></g></g><path d="M113 30 Q180 7 247 30" fill="none" stroke="#c8bfb4" stroke-width="2"/></svg></div></div><div class="toolbar"><button class="primary" id="generate">✨ 生成商品效果图</button><button id="random">随机设计</button><button data-p="sun">☀️</button><button data-p="cloud">☁️</button><button data-p="star">✦</button><button data-p="wave">〰</button><button data-p="heart">♡</button></div><p class="hint">点击“生成商品效果图”会根据当前袜型、颜色、图案和防滑设计重新渲染立体商品预览。</p></div><div class="panel"><h2>防滑底</h2><h3>防滑图案</h3><div class="grid" id="grips"><button class="active" data-g="dots">点状</button><button data-g="stars">星星</button><button data-g="flowers">花朵</button><button data-g="geo">几何</button><button data-g="brand">TIYANINI</button><button data-g="none">无防滑</button></div><h3>防滑颜色</h3><div class="colors" id="gripColors"><i class="sw" data-c="#ef6f91" style="background:#ef6f91"></i><i class="sw" data-c="#22262a" style="background:#22262a"></i><i class="sw" data-c="#fff" style="background:#fff"></i><i class="sw" data-c="#8f83c9" style="background:#8f83c9"></i><i class="sw" data-c="#76aeca" style="background:#76aeca"></i><i class="sw" data-c="#9eb98c" style="background:#9eb98c"></i><i class="sw" data-c="#d8a54a" style="background:#d8a54a"></i><i class="sw" data-c="#b97b62" style="background:#b97b62"></i></div><h3>当前设计</h3><div class="status" id="status">点状防滑 · #EF6F91</div><p class="hint">这一版重点增加“商品效果图”预览，让设计完成后更像实际袜子，而不是简单的平面图形。</p></div></div><script>let sock='#efe7da',gc='#ef6f91',g='dots',p='sun';const P=document.getElementById('pattern'),G=document.getElementById('grip');function E(n,a={}){let x=document.createElementNS('http://www.w3.org/2000/svg',n);Object.entries(a).forEach(([k,v])=>x.setAttribute(k,v));return x}function pattern(){P.innerHTML='';if(p==='none')return;if(p==='sun'){P.appendChild(E('circle',{cx:180,cy:180,r:30,fill:'none',stroke:'#d8a54a','stroke-width':5}));P.appendChild(E('circle',{cx:180,cy:180,r:7,fill:'#d8a54a'}));for(let i=0;i<8;i++){let a=i*Math.PI/4;P.appendChild(E('line',{x1:180+34*Math.cos(a),y1:180+34*Math.sin(a),x2:180+47*Math.cos(a),y2:180+47*Math.sin(a),stroke:'#d8a54a','stroke-width':5}))}}else{let t=E('text',{x:180,y:202,'text-anchor':'middle','font-size':'62',fill:'#8a6d58'});t.textContent={cloud:'☁',star:'✦',wave:'〰',heart:'♡'}[p];P.appendChild(t)}}function grip(){G.innerHTML='';if(g==='none')return;if(g==='brand'){let t=E('text',{x:190,y:486,'text-anchor':'middle',fill:gc,'font-size':'17','font-weight':'700','letter-spacing':'2'});t.textContent='TIYANINI';G.appendChild(t);return}let ch={stars:'✦',flowers:'✿',geo:'◆'}[g];for(let r=0;r<3;r++)for(let c=0;c<5;c++){let x=140+c*20+(r%2)*10,y=430+r*23;if(ch){let t=E('text',{x,y,'text-anchor':'middle',fill:gc,'font-size':'16'});t.textContent=ch;G.appendChild(t)}else G.appendChild(E('circle',{cx:x,cy:y,r:5,fill:gc}))}}function title(){document.getElementById('title').textContent=document.querySelector('#types .active').textContent+' · '+document.querySelector('#styles .active').textContent+'风'}function status(){let n={dots:'点状',stars:'星星',flowers:'花朵',geo:'几何',brand:'TIYANINI',none:'无'}[g];document.getElementById('status').textContent=n+'防滑 · '+gc.toUpperCase()}document.querySelectorAll('#types button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#types button').forEach(x=>x.classList.remove('active'));b.classList.add('active');title()});document.querySelectorAll('#styles button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#styles button').forEach(x=>x.classList.remove('active'));b.classList.add('active');title()});document.querySelectorAll('#sockColors .sw').forEach(b=>b.onclick=()=>{sock=b.dataset.c;document.documentElement.style.setProperty('--sock',sock)});document.querySelectorAll('#patterns button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#patterns button').forEach(x=>x.classList.remove('active'));b.classList.add('active');p=b.dataset.p;pattern()});document.querySelectorAll('#grips button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#grips button').forEach(x=>x.classList.remove('active'));b.classList.add('active');g=b.dataset.g;grip();status()});document.querySelectorAll('#gripColors .sw').forEach(b=>b.onclick=()=>{gc=b.dataset.c;grip();status()});document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{p=b.dataset.p;document.querySelectorAll('#patterns button').forEach(x=>x.classList.toggle('active',x.dataset.p===p));pattern()});document.getElementById('random').onclick=()=>{let A=[...document.querySelectorAll('#types button')],B=[...document.querySelectorAll('#styles button')],C=[...document.querySelectorAll('#sockColors .sw')],D=[...document.querySelectorAll('#patterns button')],F=[...document.querySelectorAll('#grips button')],H=[...document.querySelectorAll('#gripColors .sw')];A[Math.random()*A.length|0].click();B[Math.random()*B.length|0].click();C[Math.random()*C.length|0].click();D[Math.random()*D.length|0].click();F[Math.random()*F.length|0].click();H[Math.random()*H.length|0].click()};document.getElementById('generate').onclick=()=>{pattern();grip();document.getElementById('generate').textContent='✓ 商品效果图已生成';setTimeout(()=>document.getElementById('generate').textContent='✨ 生成商品效果图',900)};pattern();grip();</script></body></html>

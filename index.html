<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIYANINI SOCK LAB V8.3</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f2ed;color:#292722;font-family:-apple-system,BlinkMacSystemFont,sans-serif}header{padding:16px;background:white;font-weight:800;letter-spacing:2px}.app{max-width:1050px;margin:auto;padding:10px;display:grid;grid-template-columns:250px 1fr 270px;gap:10px}.panel,.stage{background:white;border:1px solid #ddd8cf;border-radius:18px;padding:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}h2{font-size:15px}h3{font-size:11px;color:#777;margin:16px 0 8px}button{border:1px solid #d9d3ca;background:#faf9f7;border-radius:10px;padding:10px 6px;font-size:12px}button.active{background:#292722;color:white}.colors{display:flex;gap:8px;flex-wrap:wrap}.swatch{width:30px;height:30px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px #ccc}.preview{height:570px;background:#f8f6f2;border-radius:16px;display:flex;align-items:center;justify-content:center}.sock{width:210px;height:510px;position:relative}.body,.foot,.cuff{background:var(--sock,#efe7da);border:1px solid #d5cec3}.body{position:absolute;left:37px;top:0;width:136px;height:300px;border-radius:30px 30px 10px 10px}.foot{position:absolute;left:37px;top:285px;width:147px;height:195px;border-radius:12px 12px 78px 18px;transform:skewY(-12deg)}.cuff{position:absolute;left:34px;top:0;width:142px;height:50px;border-radius:30px 30px 7px 7px;z-index:2}.pattern{position:absolute;z-index:4;top:75px;left:65px;font-size:42px}.sole{position:absolute;z-index:5;left:44px;top:346px;width:132px;height:105px;transform:skewY(-12deg);display:grid;grid-template-columns:repeat(5,1fr);gap:9px;padding:15px 12px}.dot{width:13px;height:13px;border-radius:50%;background:var(--grip,#ef6f91)}.toolbar{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:10px}@media(max-width:850px){.app{grid-template-columns:1fr}.stage{order:-1}.preview{height:510px}}</style><header>TIYANINI <small>SOCK LAB V8.3 · 袜子设计软件</small></header><div class="app"><div class="panel"><h2>① 基础设计</h2><h3>袜型</h3><div class="grid" id="types"><button class="active">中筒袜</button><button>短袜</button><button>船袜</button><button>五指袜</button><button>堆堆袜</button><button>芭蕾袜</button></div><h3>风格</h3><div class="grid" id="styles"><button class="active">海滩</button><button>运动</button><button>芭蕾</button><button>极简</button><button>复古</button><button>甜酷</button><button>自然</button><button>艺术</button></div><h3>袜子颜色</h3><div class="colors" id="sockColors"><i class="swatch" data-c="#efe7da" style="background:#efe7da"></i><i class="swatch" data-c="#d5c0a1" style="background:#d5c0a1"></i><i class="swatch" data-c="#aebaa5" style="background:#aebaa5"></i><i class="swatch" data-c="#8a6d58" style="background:#8a6d58"></i><i class="swatch" data-c="#222" style="background:#222"></i><i class="swatch" data-c="#e5b3a5" style="background:#e5b3a5"></i><i class="swatch" data-c="#8db0c9" style="background:#8db0c9"></i></div></div><div class="stage"><h2 id="title">中筒袜 · 海滩风</h2><div class="preview"><div class="sock"><div class="body"></div><div class="foot"></div><div class="cuff"></div><div class="pattern" id="pattern">☀️</div><div class="sole" id="sole"></div></div></div><div class="toolbar"><button id="random">✨ 随机</button><button data-p="☀️">太阳</button><button data-p="☁️">云朵</button><button data-p="✦">星星</button><button data-p="🌊">海浪</button><button data-p="♡">爱心</button></div></div><div class="panel"><h2>② 防滑底设计</h2><h3>防滑图案</h3><div class="grid" id="grips"><button class="active" data-g="dots">点状</button><button data-g="stars">星星</button><button data-g="flowers">花朵</button><button data-g="geo">几何</button><button data-g="brand">TIYANINI</button><button data-g="none">无防滑</button></div><h3>防滑图案颜色</h3><div class="colors" id="gripColors"><i class="swatch" data-c="#ef6f91" style="background:#ef6f91"></i><i class="swatch" data-c="#222" style="background:#222"></i><i class="swatch" data-c="#fff" style="background:#fff"></i><i class="swatch" data-c="#8f83c9" style="background:#8f83c9"></i><i class="swatch" data-c="#76aeca" style="background:#76aeca"></i><i class="swatch" data-c="#9eb98c" style="background:#9eb98c"></i><i class="swatch" data-c="#d8a54a" style="background:#d8a54a"></i><i class="swatch" data-c="#b97b62" style="background:#b97b62"></i></div><p id="status">点状防滑 · #EF6F91</p></div></div><script>let g='dots',gc='#ef6f91',S=document.getElementById('sole');function render(){S.innerHTML='';if(g==='none'){S.style.display='none';return}S.style.display=g==='brand'?'block':'grid';if(g==='brand'){S.innerHTML='<b style="color:var(--grip);display:block;transform:rotate(-90deg);margin-top:35px">TIYANINI</b>';return}let x=g==='stars'?'✦':g==='flowers'?'✿':g==='geo'?'◆':'';for(let i=0;i<15;i++){let d=document.createElement('span');d.className='dot';if(x){d.textContent=x;d.style.background='none';d.style.color='var(--grip)';d.style.fontSize='16px'}S.appendChild(d)}}function title(){document.getElementById('title').textContent=document.querySelector('#types .active').textContent+' · '+document.querySelector('#styles .active').textContent+'风'}document.querySelectorAll('#types button,#styles button').forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');title()});document.querySelectorAll('#sockColors .swatch').forEach(x=>x.onclick=()=>document.documentElement.style.setProperty('--sock',x.dataset.c));document.querySelectorAll('#grips button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#grips button').forEach(x=>x.classList.remove('active'));b.classList.add('active');g=b.dataset.g;render();document.getElementById('status').textContent=b.textContent+'防滑 · '+gc.toUpperCase()});document.querySelectorAll('#gripColors .swatch').forEach(x=>x.onclick=()=>{gc=x.dataset.c;document.documentElement.style.setProperty('--grip',gc);document.getElementById('status').textContent=document.querySelector('#grips .active').textContent+'防滑 · '+gc.toUpperCase()});document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>document.getElementById('pattern').textContent=b.dataset.p);document.getElementById('random').onclick=()=>{let a=[...document.querySelectorAll('#grips button')];a[Math.floor(Math.random()*a.length)].click();let c=[...document.querySelectorAll('#gripColors .swatch')];c[Math.floor(Math.random()*c.length)].click()};render();</script></html>

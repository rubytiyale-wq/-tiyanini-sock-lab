<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIYANINI SOCK LAB V9 · AI</title><style>body{margin:0;background:#f4f1eb;color:#292722;font-family:-apple-system,BlinkMacSystemFont,sans-serif}header{padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:800;letter-spacing:2px}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #ddd7ce;border-radius:18px;padding:18px;margin-bottom:12px}.hero{min-height:420px;background:#f8f6f2;border-radius:15px;display:flex;align-items:center;justify-content:center}.sock{width:210px;height:390px;position:relative}.body,.foot{position:absolute;background:var(--sock,#efe7da);border:1px solid #c9c1b5}.body{left:38px;top:10px;width:134px;height:240px;border-radius:28px}.foot{left:38px;top:235px;width:145px;height:140px;border-radius:12px 12px 65px 16px;transform:skewY(-10deg)}.pat{position:absolute;z-index:2;top:80px;left:70px;font-size:55px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:1px solid #d8d1c7;background:#faf9f7;border-radius:10px;padding:11px 14px;cursor:pointer}button.primary{background:#292722;color:#fff}.status{margin-top:12px;padding:12px;border-radius:10px;background:#f6f2ec;font-size:12px;line-height:1.6}.note{font-size:12px;color:#777;line-height:1.7}</style></head><body><header>TIYANINI <small>SOCK LAB V9 · AI商品效果图</small></header><div class="wrap"><div class="card"><h2>AI 真实商品图</h2><p class="note">先在设计区完成袜型、颜色、图案和防滑设计，再点击下面按钮。此版本已预留安全后端接口，不会把 API Key 放进网页。</p><div class="hero"><div class="sock"><div class="body"></div><div class="foot"></div><div class="pat">☀</div></div></div><div class="actions"><button class="primary" id="generate">✨ AI 生成真实商品图</button><button id="retry">↻ 重新生成</button><button id="front">正面</button><button id="angle">45°</button><button id="side">侧面</button><button id="sole">袜底</button></div><div class="status" id="status">AI接口尚未配置。点击生成后会检查安全后端连接。</div></div><div class="card"><h3>接入方式</h3><p class="note">网页端 → 安全后端 → GPT-Image-2 → 返回商品图。API Key 必须保存在后端环境变量中，不能放在 GitHub Pages 的前端代码里。</p></div></div><script>const status=document.getElementById('status');async function generate(){status.textContent='正在连接 AI 商品图生成服务…';try{const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:'Create a photorealistic studio product image of a premium women’s Pilates sock based on the current TIYANINI design. Preserve the exact sock silhouette, colors, decorative pattern and anti-slip sole design. Show realistic knitted fabric, accurate proportions, soft studio lighting, clean luxury fashion product photography.'})});if(!r.ok)throw new Error('API_NOT_CONFIGURED');const d=await r.json();if(d.image_url){document.querySelector('.hero').innerHTML='<img src="'+d.image_url+'" style="max-width:100%;max-height:100%;object-fit:contain">';status.textContent='✨ AI商品图生成完成。'}else throw new Error('NO_IMAGE')}catch(e){status.innerHTML='⚠️ 现在按钮已经接好，但安全后端还没有部署。<br>下一步只需要把后端部署并加入你的 API Key，就能真正生成 AI 商品图。'}}document.getElementById('generate').onclick=generate;document.getElementById('retry').onclick=generate;</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIYANINI SOCK LAB V9</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f1eb;color:#292722;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:15px 18px;background:#fff;border-bottom:1px solid #ddd7ce;font-weight:800;letter-spacing:2px;position:sticky;top:0;z-index:5}.v{font-size:10px;color:#999}.app{max-width:1180px;margin:auto;padding:10px;display:grid;grid-template-columns:270px 1fr 285px;gap:10px}.panel,.stage{background:#fff;border:1px solid #ddd7ce;border-radius:18px;padding:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}h2{font-size:15px;margin:2px 0 12px}h3{font-size:10px;color:#777;margin:15px 0 7px}button{border:1px solid #d8d1c7;background:#faf9f7;border-radius:10px;padding:9px 5px;font-size:11px;color:#292722;cursor:pointer}button.active{background:#292722;color:#fff}.colors{display:flex;gap:7px;flex-wrap:wrap}.sw{width:29px;height:29px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px #c9c2b9;cursor:pointer}.preview{height:580px;background:#f8f6f2;border-radius:15px;display:flex;align-items:center;justify-content:center;overflow:hidden}.socksvg{width:min(380px,96%);height:555px;filter:drop-shadow(12px 18px 12px #0002)}.toolbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:9px}.status{margin-top:10px;background:#f6f2ec;padding:10px;border-radius:10px;font-size:11px;line-height:1.7}.upload{display:block;border:1px dashed #bbb2a7;padding:14px;border-radius:11px;text-align:center;font-size:11px;cursor:pointer;background:#faf9f7}.upload input{display:none}.range{width:100%}@media(max-width:900px){.app{grid-template-columns:1fr}.stage{order:-1}.preview{height:530px}.socksvg{height:510px}}</style></head><body><header>TIYANINI <span class="v">SOCK LAB V9 · 3D DESIGN STUDIO</span></header><div class="app"><section class="panel"><h2>① 设计袜子</h2><h3>袜型</h3><div class="grid" id="types"><button class="active">中筒</button><button>短筒</button><button>船袜</button><button>五指</button><button>堆堆</button><button>芭蕾</button><button>高筒</button><button>运动袜</button></div><h3>风格</h3><div class="grid" id="styles"><button class="active">极简</button><button>海滩</button><button>运动</button><button>芭蕾</button><button>复古</button><button>甜酷</button><button>学院</button><button>法式</button><button>街头</button><button>自然</button><button>艺术</button><button>度假</button></div><h3>袜子颜色</h3><div class="colors" id="sockColors"></div><h3>图案</h3><div class="grid" id="patterns"><button class="active" data-p="sun">太阳</button><button data-p="cloud">云朵</button><button data-p="star">星星</button><button data-p="wave">海浪</button><button data-p="flower">花朵</button><button data-p="heart">爱心</button><button data-p="stripe">条纹</button><button data-p="dot">波点</button><button data-p="bow">蝴蝶结</button><button data-p="shell">贝壳</button><button data-p="lemon">柠檬</button><button data-p="cherry">樱桃</button><button data-p="cloudstar">云星</button><button data-p="logo">TIYANINI</button><button data-p="none">纯色</button></div><h3>自定义图案</h3><label class="upload">📷 上传自己的图片<input id="img" type="file" accept="image/*"></label><h3>图案大小</h3><input class="range" id="size" type="range" min="25" max="120" value="65"></section><section class="stage"><h2 id="title">中筒 · 极简风</h2><div class="preview"><svg class="socksvg" viewBox="0 0 360 560"><defs><linearGradient id="shade"><stop offset="0" stop-opacity=".02"/><stop offset=".55" stop-opacity="0"/><stop offset="1" stop-opacity=".18"/></linearGradient><clipPath id="clip"><path d="M110 28Q180 7 250 28V330q0 45 33 82l38 42q23 26 8 52-15 25-52 24H113q-42 0-56-28-13-26 9-48l43-43q3-5 3-21Z"/></clipPath></defs><path d="M110 28Q180 7 250 28V330q0 45 33 82l38 42q23 26 8 52-15 25-52 24H113q-42 0-56-28-13-26 9-48l43-43q3-5 3-21Z" fill="var(--sock,#efe7da)" stroke="#c9c1b5" stroke-width="2"/><g clip-path="url(#clip)"><rect x="45" y="5" width="285" height="530" fill="url(#shade)"/><path d="M104 18Q180 0 256 18v55q-76-18-152 0Z" fill="var(--sock,#efe7da)" stroke="#c9c1b5"/><g id="patternG"></g><g id="gripG"></g></g><path d="M110 28Q180 7 250 28" fill="none" stroke="#bdb4a8" stroke-width="2"/></svg></div><div class="toolbar"><button id="random">✨ 随机设计</button><button id="render">✨ 生成3D商品图</button><button id="front">正面</button><button id="angle">45°</button><button id="side">侧面</button><button id="sole">袜底</button></div><div class="status" id="result">当前为实时3D立体预览。点击“生成3D商品图”可生成商品展示视图。</div></section><section class="panel"><h2>② 袜底 / 防滑</h2><h3>防滑图案</h3><div class="grid" id="grips"><button class="active" data-g="dots">点状</button><button data-g="stars">星星</button><button data-g="flowers">花朵</button><button data-g="hearts">爱心</button><button data-g="geo">几何</button><button data-g="waves">波浪</button><button data-g="brand">TIYANINI</button><button data-g="none">无防滑</button></div><h3>防滑颜色</h3><div class="colors" id="gripColors"></div><h3>防滑大小</h3><input class="range" id="gripSize" type="range" min="4" max="12" value="7"><h3>自定义防滑文字</h3><input id="customText" placeholder="例如 TIYANINI" style="width:100%;padding:9px;border:1px solid #ddd;border-radius:9px"><h3>保存</h3><button id="save" style="width:100%">💾 保存设计截图</button></section></div><script>const SC=['#F7F3EA','#EFE7DA','#E3D4BE','#C9B79C','#AEBBA6','#7F927B','#8DB0C9','#B8D6E5','#E5B3A5','#C9878B','#D8A0B8','#B6A5D6','#8A6D58','#B97B62','#22262A','#FFFFFF','#F2C94C','#E8A33A','#E76F51'];const GC=['#EF6F91','#22262A','#FFFFFF','#8F83C9','#76AECA','#9EB98C','#D8A54A','#B97B62','#F2C94C','#E76F51','#5B8C85','#C9B79C'];let pattern='sun',grip='dots',gc='#EF6F91',customImg=null;const NS='http://www.w3.org/2000/svg',PG=document.getElementById('patternG'),GG=document.getElementById('gripG');function sw(id,a,fn){let b=document.getElementById(id);a.forEach(c=>{let x=document.createElement('i');x.className='sw';x.style.background=c;x.onclick=()=>fn(c);b.appendChild(x)})}sw('sockColors',SC,c=>document.documentElement.style.setProperty('--sock',c));sw('gripColors',GC,c=>{gc=c;drawGrip();status()});function E(n,a){let x=document.createElementNS(NS,n);for(let k in a)x.setAttribute(k,a[k]);return x}function drawPattern(){PG.innerHTML='';if(customImg){let i=E('image',{href:customImg,x:95,y:110,width:170,height:170,preserveAspectRatio:'xMidYMid meet',opacity:.9});PG.appendChild(i);return}if(pattern==='none')return;if(pattern==='stripe'){for(let y=105;y<280;y+=32)PG.appendChild(E('rect',{x:90,y,width:180,height:13,fill:'#B97B62'}));return}if(pattern==='dot'){for(let y=120;y<270;y+=32)for(let x=115;x<250;x+=32)PG.appendChild(E('circle',{cx:x,cy:y,r:7,fill:'#D8A54A'}));return}let map={sun:'☀',cloud:'☁',star:'✦',wave:'〰',flower:'✿',heart:'♡',bow:'🎀',shell:'🐚',lemon:'🍋',cherry:'🍒',cloudstar:'☁✦',logo:'TIYANINI'};let t=E('text',{x:180,y:205,'text-anchor':'middle','font-size':pattern==='logo'?25:70,fill:'#8A6D58','font-weight':pattern==='logo'?'700':'400'});t.textContent=map[pattern]||'';PG.appendChild(t)}function drawGrip(){GG.innerHTML='';if(grip==='none')return;if(grip==='brand'){let t=E('text',{x:180,y:495,'text-anchor':'middle',fill:gc,'font-size':18,'font-weight':700,'letter-spacing':2});t.textContent=document.getElementById('customText').value||'TIYANINI';GG.appendChild(t);return}let char={stars:'✦',flowers:'✿',hearts:'♡',geo:'◆',waves:'〰'}[grip],sz=+document.getElementById('gripSize').value*2;for(let r=0;r<3;r++)for(let c=0;c<5;c++){let x=138+c*21+(r%2)*10,y=435+r*22;if(char){let t=E('text',{x,y,'text-anchor':'middle',fill:gc,'font-size':sz});t.textContent=char;GG.appendChild(t)}else GG.appendChild(E('circle',{cx:x,cy:y,r:+document.getElementById('gripSize').value,fill:gc}))}}function status(){let n={dots:'点状',stars:'星星',flowers:'花朵',hearts:'爱心',geo:'几何',waves:'波浪',brand:'文字',none:'无'}[grip];document.getElementById('status').textContent=n+'防滑 · '+gc}function title(){document.getElementById('title').textContent=document.querySelector('#types .active').textContent+' · '+document.querySelector('#styles .active').textContent+'风'}document.querySelectorAll('#types button,#styles button').forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');title()});document.querySelectorAll('#patterns button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#patterns button').forEach(x=>x.classList.remove('active'));b.classList.add('active');pattern=b.dataset.p;customImg=null;drawPattern()});document.querySelectorAll('#grips button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#grips button').forEach(x=>x.classList.remove('active'));b.classList.add('active');grip=b.dataset.g;drawGrip();status()});document.querySelectorAll('#gripColors .sw').forEach(()=>{});document.getElementById('size').oninput=e=>{PG.setAttribute('transform','translate(180 190) scale('+(e.target.value/65)+') translate(-180 -190)')};document.getElementById('gripSize').oninput=drawGrip;document.getElementById('customText').oninput=drawGrip;document.getElementById('img').onchange=e=>{let f=e.target.files[0];if(f){let r=new FileReader();r.onload=()=>{customImg=r.result;drawPattern()};r.readAsDataURL(f)}};document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{pattern=b.dataset.p;customImg=null;drawPattern()});document.getElementById('random').onclick=()=>{let q=id=>[...document.querySelectorAll(id+' button')];q('#types')[Math.floor(Math.random()*q('#types').length)].click();q('#styles')[Math.floor(Math.random()*q('#styles').length)].click();q('#patterns')[Math.floor(Math.random()*q('#patterns').length)].click();q('#grips')[Math.floor(Math.random()*q('#grips').length)].click();[...document.querySelectorAll('#sockColors .sw')][Math.floor(Math.random()*SC.length)].click();[...document.querySelectorAll('#gripColors .sw')][Math.floor(Math.random()*GC.length)].click()};document.getElementById('render').onclick=()=>document.getElementById('result').textContent='✨ 3D商品视图已生成：当前设计已应用到袜身、袜底与立体阴影。真正的AI摄影级渲染仍需连接图像生成API。';document.getElementById('save').onclick=()=>alert('请使用手机截图保存当前设计；下一版可加入真正的PNG导出。');drawPattern();drawGrip();</script></body></html>

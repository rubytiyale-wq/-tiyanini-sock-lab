<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIYANINI SOCK LAB V8.6</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f1eb;color:#27251f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:16px;background:#fff;border-bottom:1px solid #ddd7ce;font-weight:800;letter-spacing:2px}small{font-size:10px;color:#888}.app{max-width:1150px;margin:auto;padding:10px;display:grid;grid-template-columns:270px 1fr 285px;gap:10px}.panel,.stage{background:#fff;border:1px solid #ddd7ce;border-radius:18px;padding:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}h2{font-size:15px;margin:2px 0 12px}h3{font-size:10px;color:#777;margin:14px 0 7px;letter-spacing:.5px}button{border:1px solid #d8d1c7;background:#faf9f7;border-radius:10px;padding:9px 5px;font-size:11px;color:#27251f}button.active{background:#27251f;color:#fff}.colors{display:flex;gap:8px;flex-wrap:wrap}.swatch{width:29px;height:29px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #c9c2b9;cursor:pointer}.preview{height:575px;background:#f8f6f2;border-radius:15px;display:flex;align-items:center;justify-content:center;overflow:hidden}.socksvg{width:min(360px,94%);height:545px}.toolbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:9px}.toolbar button{padding:8px}.status{margin-top:10px;background:#f6f2ec;padding:10px;border-radius:10px;font-size:11px;line-height:1.6}.note{font-size:10px;color:#888;line-height:1.6}@media(max-width:900px){.app{grid-template-columns:1fr}.stage{order:-1}.preview{height:530px}.socksvg{height:510px}}</style></head><body><header>TIYANINI <small>SOCK LAB V8.6 · 多款式袜子设计</small></header><div class="app"><section class="panel"><h2>① 袜子设计</h2><h3>袜型</h3><div class="grid" id="types"><button class="active">中筒</button><button>短筒</button><button>船袜</button><button>五指</button><button>堆堆</button><button>芭蕾</button><button>高筒</button><button>运动袜</button></div><h3>风格</h3><div class="grid" id="styles"><button class="active">海滩</button><button>运动</button><button>芭蕾</button><button>极简</button><button>复古</button><button>甜酷</button><button>学院</button><button>法式</button><button>街头</button><button>自然</button><button>艺术</button><button>度假</button></div><h3>袜子颜色</h3><div class="colors" id="sockColors"></div><h3>图案款式</h3><div class="grid" id="patterns"><button class="active" data-p="sun">太阳</button><button data-p="cloud">云朵</button><button data-p="star">星星</button><button data-p="wave">海浪</button><button data-p="flower">花朵</button><button data-p="heart">爱心</button><button data-p="stripe">条纹</button><button data-p="dot">波点</button><button data-p="bow">蝴蝶结</button><button data-p="shell">贝壳</button><button data-p="lemon">柠檬</button><button data-p="cherry">樱桃</button><button data-p="cloudstar">云星</button><button data-p="logo">TIYANINI</button><button data-p="none">纯色</button></div></section><section class="stage"><h2 id="title">中筒 · 海滩风</h2><div class="preview"><svg class="socksvg" viewBox="0 0 360 560"><defs><linearGradient id="shade"><stop offset="0" stop-opacity=".03"/><stop offset=".55" stop-opacity="0"/><stop offset="1" stop-opacity=".13"/></linearGradient><clipPath id="clip"><path d="M112 28Q180 7 248 28V333q0 43 32 78l39 43q23 26 8 52-15 25-52 24H113q-42 0-56-28-13-26 9-48l43-43q3-5 3-21Z"/></clipPath></defs><path d="M112 28Q180 7 248 28V333q0 43 32 78l39 43q23 26 8 52-15 25-52 24H113q-42 0-56-28-13-26 9-48l43-43q3-5 3-21Z" fill="var(--sock,#efe7da)" stroke="#cfc7bc" stroke-width="2"/><g clip-path="url(#clip)"><rect x="45" y="5" width="285" height="530" fill="url(#shade)"/><path d="M105 18Q180 0 255 18v55q-75-18-150 0Z" fill="var(--sock,#efe7da)" stroke="#cfc7bc"/><g id="patternG" transform="translate(180 190)"></g><g id="gripG"></g></g><path d="M112 28Q180 7 248 28" fill="none" stroke="#c5bdb2" stroke-width="2"/></svg></div><div class="toolbar"><button id="random">✨ 随机整套</button><button data-p="sun">☀️</button><button data-p="star">✦</button><button data-p="wave">〰</button><button data-p="flower">✿</button><button data-p="heart">♡</button></div></section><section class="panel"><h2>② 防滑底设计</h2><h3>防滑图案</h3><div class="grid" id="grips"><button class="active" data-g="dots">点状</button><button data-g="stars">星星</button><button data-g="flowers">花朵</button><button data-g="hearts">爱心</button><button data-g="geo">几何</button><button data-g="waves">波浪</button><button data-g="brand">TIYANINI</button><button data-g="none">无防滑</button></div><h3>防滑颜色</h3><div class="colors" id="gripColors"></div><div class="status" id="status">点状防滑 · 粉色</div><p class="note">颜色、袜型、风格、主图案、防滑图案都可以独立切换。点击“随机整套”可以快速组合不同设计。</p></section></div><script>const sockColors=['#F7F3EA','#EFE7DA','#E3D4BE','#C9B79C','#AEBBA6','#7F927B','#8DB0C9','#B8D6E5','#E5B3A5','#C9878B','#D8A0B8','#B6A5D6','#8A6D58','#B97B62','#22262A','#FFFFFF','#F2C94C','#E8A33A'];const gripColors=['#EF6F91','#22262A','#FFFFFF','#8F83C9','#76AECA','#9EB98C','#D8A54A','#B97B62','#F2C94C','#E76F51','#5B8C85','#C9B79C'];let pattern='sun',grip='dots',gc='#EF6F91';const NS='http://www.w3.org/2000/svg',PG=document.getElementById('patternG'),GG=document.getElementById('gripG');function swatches(id,arr,cb){let box=document.getElementById(id);arr.forEach(c=>{let s=document.createElement('i');s.className='swatch';s.style.background=c;s.onclick=()=>cb(c);box.appendChild(s)})}swatches('sockColors',sockColors,c=>document.documentElement.style.setProperty('--sock',c));swatches('gripColors',gripColors,c=>{gc=c;drawGrip();status()});function E(n,a){let x=document.createElementNS(NS,n);for(let k in a)x.setAttribute(k,a[k]);return x}function drawPattern(){PG.innerHTML='';let p=pattern;if(p==='none')return;if(p==='sun'){PG.appendChild(E('circle',{r:28,fill:'none',stroke:'#D8A54A','stroke-width':4}));for(let i=0;i<8;i++){let a=i*Math.PI/4;PG.appendChild(E('line',{x1:Math.cos(a)*35,y1:Math.sin(a)*35,x2:Math.cos(a)*47,y2:Math.sin(a)*47,stroke:'#D8A54A','stroke-width':4}))}}else if(p==='stripe'){for(let i=-2;i<3;i++)PG.appendChild(E('line',{x1:-80,y1:i*30,x2:80,y2:i*30,stroke:'#B97B62','stroke-width':10}))}else if(p==='dot'){for(let y=-35;y<=35;y+=25)for(let x=-45;x<=45;x+=25)PG.appendChild(E('circle',{cx:x,cy:y,r:6,fill:'#D8A54A'}))}else{let map={cloud:'☁',star:'✦',wave:'〰',flower:'✿',heart:'♡',bow:'🎀',shell:'🐚',lemon:'🍋',cherry:'🍒',cloudstar:'☁✦',logo:'TIYANINI'};let t=E('text',{x:0,y:15,'text-anchor':'middle','font-size':p==='logo'?18:58,fill:'#8A6D58','font-weight':p==='logo'?'700':'400'});t.textContent=map[p]||'';PG.appendChild(t)}}function drawGrip(){GG.innerHTML='';if(grip==='none')return;if(grip==='brand'){let t=E('text',{x:180,y:490,'text-anchor':'middle',fill:gc,'font-size':16,'font-weight':700,'letter-spacing':2});t.textContent='TIYANINI';GG.appendChild(t);return}let char={stars:'✦',flowers:'✿',hearts:'♡',geo:'◆',waves:'〰'}[grip];for(let r=0;r<3;r++)for(let c=0;c<5;c++){let x=138+c*21+(r%2)*10,y=435+r*22;if(char){let t=E('text',{x,y,'text-anchor':'middle',fill:gc,'font-size':16});t.textContent=char;GG.appendChild(t)}else GG.appendChild(E('circle',{cx:x,cy:y,r:5,fill:gc}))}}function status(){let n={dots:'点状',stars:'星星',flowers:'花朵',hearts:'爱心',geo:'几何',waves:'波浪',brand:'TIYANINI',none:'无'}[grip];document.getElementById('status').textContent=n+'防滑 · '+gc}function title(){document.getElementById('title').textContent=document.querySelector('#types .active').textContent+' · '+document.querySelector('#styles .active').textContent+'风'}document.querySelectorAll('#types button,#styles button').forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');title()});document.querySelectorAll('#patterns button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#patterns button').forEach(x=>x.classList.remove('active'));b.classList.add('active');pattern=b.dataset.p;drawPattern()});document.querySelectorAll('#grips button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#grips button').forEach(x=>x.classList.remove('active'));b.classList.add('active');grip=b.dataset.g;drawGrip();status()});document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{pattern=b.dataset.p;drawPattern();document.querySelectorAll('#patterns button').forEach(x=>x.classList.toggle('active',x.dataset.p===pattern))});document.getElementById('random').onclick=()=>{let q=id=>[...document.querySelectorAll(id+' button')];q('#types')[Math.floor(Math.random()*q('#types').length)].click();q('#styles')[Math.floor(Math.random()*q('#styles').length)].click();let ps=q('#patterns');ps[Math.floor(Math.random()*ps.length)].click();let gs=q('#grips');gs[Math.floor(Math.random()*gs.length)].click();let cs=[...document.querySelectorAll('#sockColors .swatch')];cs[Math.floor(Math.random()*cs.length)].click();let gcx=[...document.querySelectorAll('#gripColors .swatch')];gcx[Math.floor(Math.random()*gcx.length)].click()};drawPattern();drawGrip();</script></body></html>

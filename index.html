<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIYANINI SOCK LAB V8.4</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f2ed;color:#292722;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:16px;background:#fff;border-bottom:1px solid #ddd8cf;font-weight:800;letter-spacing:2px}.app{max-width:1100px;margin:auto;padding:10px;display:grid;grid-template-columns:245px 1fr 265px;gap:10px}.panel,.stage{background:#fff;border:1px solid #ddd8cf;border-radius:18px;padding:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}h2{font-size:15px;margin:2px 0 14px}h3{font-size:11px;color:#777;margin:15px 0 8px}button{border:1px solid #d9d3ca;background:#faf9f7;border-radius:10px;padding:9px 6px;font-size:12px;color:#292722}button.active{background:#292722;color:#fff}.colors{display:flex;gap:9px;flex-wrap:wrap}.swatch{width:30px;height:30px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px #ccc;cursor:pointer}.preview{height:570px;background:#f8f6f2;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden}.socksvg{width:min(340px,90%);height:540px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:10px}.toolbar button{padding:8px 10px}.note{font-size:10px;color:#888;line-height:1.6}.status{font-size:12px;background:#f7f4ef;padding:10px;border-radius:10px}@media(max-width:850px){.app{grid-template-columns:1fr}.stage{order:-1}.preview{height:530px}.socksvg{height:510px}}
</style></head><body><header>TIYANINI <span style="font-size:10px;color:#888">SOCK LAB V8.4 · 立体袜型预览</span></header><div class="app"><div class="panel"><h2>① 袜子设计</h2><h3>袜型</h3><div class="grid" id="types"><button class="active" data-type="mid">中筒袜</button><button data-type="ankle">短袜</button><button data-type="noShow">船袜</button><button data-type="toe">五指袜</button><button data-type="slouch">堆堆袜</button><button data-type="ballet">芭蕾袜</button></div><h3>风格</h3><div class="grid" id="styles"><button class="active">海滩</button><button>运动</button><button>芭蕾</button><button>极简</button><button>复古</button><button>甜酷</button><button>自然</button><button>艺术</button></div><h3>袜子颜色</h3><div class="colors" id="sockColors"><i class="swatch" data-c="#efe7da" style="background:#efe7da"></i><i class="swatch" data-c="#d5c0a1" style="background:#d5c0a1"></i><i class="swatch" data-c="#aebaa5" style="background:#aebaa5"></i><i class="swatch" data-c="#8a6d58" style="background:#8a6d58"></i><i class="swatch" data-c="#22262a" style="background:#22262a"></i><i class="swatch" data-c="#e5b3a5" style="background:#e5b3a5"></i><i class="swatch" data-c="#8db0c9" style="background:#8db0c9"></i><i class="swatch" data-c="#fff" style="background:#fff"></i></div><h3>主图案</h3><div class="grid" id="patterns"><button class="active" data-p="sun">太阳</button><button data-p="cloud">云朵</button><button data-p="star">星星</button><button data-p="wave">海浪</button><button data-p="heart">爱心</button><button data-p="none">无图案</button></div></div><div class="stage"><h2 id="title">中筒袜 · 海滩风</h2><div class="preview"><svg class="socksvg" viewBox="0 0 360 560" aria-label="袜子预览"><defs><linearGradient id="shade" x1="0" x2="1"><stop offset="0" stop-opacity=".06"/><stop offset=".55" stop-opacity="0"/><stop offset="1" stop-opacity=".12"/></linearGradient><clipPath id="sockClip"><path id="sockPath" d="M115 28 Q180 8 245 28 L245 338 Q246 374 276 407 L317 454 Q337 476 323 504 Q308 531 271 528 L117 528 Q76 527 60 500 Q47 473 69 451 L111 409 Q115 404 115 386 Z"/></clipPath></defs><path id="sockBase" d="M115 28 Q180 8 245 28 L245 338 Q246 374 276 407 L317 454 Q337 476 323 504 Q308 531 271 528 L117 528 Q76 527 60 500 Q47 473 69 451 L111 409 Q115 404 115 386 Z" fill="var(--sock,#efe7da)" stroke="#d3cbc0" stroke-width="2"/><g clip-path="url(#sockClip)"><rect x="45" y="10" width="285" height="525" fill="url(#shade)"/><rect id="cuff" x="105" y="15" width="150" height="55" rx="22" fill="var(--sock,#efe7da)" opacity=".9"/><g id="mainPattern" transform="translate(180 185)"><circle r="32" fill="none" stroke="#d8a54a" stroke-width="4"/><path d="M0-48V48M-48 0H48" stroke="#d8a54a" stroke-width="4"/><circle r="7" fill="#d8a54a"/></g><g id="gripGroup"></g></g><path id="edge" d="M115 28 Q180 8 245 28" fill="none" stroke="#c9c0b5" stroke-width="2"/></svg></div><div class="toolbar"><button id="random">✨ 随机设计</button><button data-p="sun">☀️</button><button data-p="cloud">☁️</button><button data-p="star">✦</button><button data-p="wave">〰</button><button data-p="heart">♡</button></div></div><div class="panel"><h2>② 防滑底设计</h2><h3>防滑图案</h3><div class="grid" id="grips"><button class="active" data-g="dots">点状</button><button data-g="stars">星星</button><button data-g="flowers">花朵</button><button data-g="geo">几何</button><button data-g="brand">TIYANINI</button><button data-g="none">无防滑</button></div><h3>防滑图案颜色</h3><div class="colors" id="gripColors"><i class="swatch" data-c="#ef6f91" style="background:#ef6f91"></i><i class="swatch" data-c="#22262a" style="background:#22262a"></i><i class="swatch" data-c="#fff" style="background:#fff"></i><i class="swatch" data-c="#8f83c9" style="background:#8f83c9"></i><i class="swatch" data-c="#76aeca" style="background:#76aeca"></i><i class="swatch" data-c="#9eb98c" style="background:#9eb98c"></i><i class="swatch" data-c="#d8a54a" style="background:#d8a54a"></i><i class="swatch" data-c="#b97b62" style="background:#b97b62"></i></div><h3>当前设置</h3><div class="status" id="status">点状防滑 · #EF6F91</div><p class="note">现在会直接绘制更接近真实袜子轮廓的预览。防滑区域位于袜底，并可独立换颜色。</p></div></div><script>
let sockColor='#efe7da',grip='dots',gripColor='#ef6f91',pattern='sun',type='mid';const NS='http://www.w3.org/2000/svg',G=document.getElementById('gripGroup'),P=document.getElementById('mainPattern');function el(n,a={}){let x=document.createElementNS(NS,n);for(let k in a)x.setAttribute(k,a[k]);return x}
function drawGrip(){G.innerHTML='';if(grip==='none')return;if(grip==='brand'){let t=el('text',{x:188,y:485,'text-anchor':'middle',fill:gripColor,'font-size':'17','font-weight':'700','letter-spacing':'2'});t.textContent='TIYANINI';G.appendChild(t);return}let chars={stars:'✦',flowers:'✿',geo:'◆'}[grip];for(let r=0;r<3;r++)for(let c=0;c<5;c++){let x=145+c*19+(r%2)*9,y=430+r*22;if(chars){let t=el('text',{x,y,'text-anchor':'middle',fill:gripColor,'font-size':'15'});t.textContent=chars;G.appendChild(t)}else G.appendChild(el('circle',{cx:x,cy:y,r:5,fill:gripColor}))}}
function drawPattern(){P.innerHTML='';if(pattern==='none')return;if(pattern==='sun'){P.appendChild(el('circle',{r:28,fill:'none',stroke:'#d8a54a','stroke-width':4}));P.appendChild(el('circle',{r:7,fill:'#d8a54a'}));for(let i=0;i<8;i++){let a=i*Math.PI/4,x=Math.cos(a)*42,y=Math.sin(a)*42;P.appendChild(el('line',{x1:x*.75,y1:y*.75,x2:x,y2:y,stroke:'#d8a54a','stroke-width':4}))}}else{let t=el('text',{x:0,y:15,'text-anchor':'middle','font-size':'60',fill:'#8a6d58'});t.textContent={cloud:'☁',star:'✦',wave:'〰',heart:'♡'}[pattern];P.appendChild(t)}}
function title(){document.getElementById('title').textContent=document.querySelector('#types .active').textContent+' · '+document.querySelector('#styles .active').textContent+'风'}function status(){document.getElementById('status').textContent=({'dots':'点状','stars':'星星','flowers':'花朵','geo':'几何','brand':'TIYANINI','none':'无'}[grip]||'')+'防滑 · '+gripColor.toUpperCase()}
document.querySelectorAll('#types button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#types button').forEach(x=>x.classList.remove('active'));b.classList.add('active');type=b.dataset.type;title()});document.querySelectorAll('#styles button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#styles button').forEach(x=>x.classList.remove('active'));b.classList.add('active');title()});document.querySelectorAll('#sockColors .swatch').forEach(s=>s.onclick=()=>{sockColor=s.dataset.c;document.documentElement.style.setProperty('--sock',sockColor)});document.querySelectorAll('#patterns button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#patterns button').forEach(x=>x.classList.remove('active'));b.classList.add('active');pattern=b.dataset.p;drawPattern()});document.querySelectorAll('#grips button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#grips button').forEach(x=>x.classList.remove('active'));b.classList.add('active');grip=b.dataset.g;drawGrip();status()});document.querySelectorAll('#gripColors .swatch').forEach(s=>s.onclick=()=>{gripColor=s.dataset.c;drawGrip();status()});document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{pattern=b.dataset.p;document.querySelectorAll('#patterns button').forEach(x=>x.classList.toggle('active',x.dataset.p===pattern));drawPattern()});document.getElementById('random').onclick=()=>{let a=[...document.querySelectorAll('#types button')],b=[...document.querySelectorAll('#styles button')],c=[...document.querySelectorAll('#sockColors .swatch')],d=[...document.querySelectorAll('#patterns button')],e=[...document.querySelectorAll('#grips button')],f=[...document.querySelectorAll('#gripColors .swatch')];a[Math.floor(Math.random()*a.length)].click();b[Math.floor(Math.random()*b.length)].click();c[Math.floor(Math.random()*c.length)].click();d[Math.floor(Math.random()*d.length)].click();e[Math.floor(Math.random()*e.length)].click();f[Math.floor(Math.random()*f.length)].click()};drawGrip();drawPattern();
</script></body></html>

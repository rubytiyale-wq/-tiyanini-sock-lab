<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIYANINI SOCK LAB V11 · 3D REAL DESIGN</title><style>body{margin:0;background:#eeeae3;color:#282621;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:16px 18px;background:#fff;border-bottom:1px solid #ddd6cc;font-weight:800;letter-spacing:2px}.wrap{max-width:1250px;margin:auto;padding:14px}.layout{display:grid;grid-template-columns:340px 1fr;gap:12px}.card{background:#fff;border:1px solid #ddd6cc;border-radius:18px;padding:14px}.group{border-top:1px solid #eee7de;padding-top:12px;margin-top:12px}.label{font-size:12px;font-weight:700;margin:8px 0 6px}.small{font-size:11px;color:#777;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}button{border:1px solid #d6cec3;background:#faf9f6;border-radius:10px;padding:9px 7px;cursor:pointer}button.active,button.primary{background:#282621;color:#fff}.palette{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}.swatch{height:28px;border-radius:7px;border:1px solid #ddd}.colorrow{display:grid;grid-template-columns:50px 1fr;gap:7px;align-items:center}.colorrow input[type=color]{width:50px;height:38px;border:0}.colorrow input[type=text]{width:100%;box-sizing:border-box;padding:9px;border:1px solid #ddd6cc;border-radius:9px}.range{width:100%}.scene{height:650px;border-radius:15px;background:radial-gradient(circle at 50% 30%,#fff,#ddd8d0);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;perspective:1000px;touch-action:none}.model{width:330px;height:570px;position:relative;transform-style:preserve-3d;cursor:grab;transition:transform .12s}.sockShape{position:absolute;inset:0;filter:drop-shadow(22px 25px 18px #0003)}.sockPart{position:absolute;background:var(--sock,#eee7da);border:1px solid #bdb4a8;box-shadow:inset -28px 0 35px #00000016,inset 13px 0 22px #ffffff5c}.cuff{left:84px;top:15px;width:162px;height:78px;border-radius:31px 31px 15px 15px}.leg{left:84px;top:75px;width:162px;height:325px;border-radius:15px}.foot{left:79px;top:385px;width:214px;height:145px;border-radius:18px 92px 80px 25px;transform:skewY(-7deg)}.rib{position:absolute;left:92px;top:25px;width:146px;height:58px;border-radius:20px;opacity:.18;background:repeating-linear-gradient(90deg,transparent 0 5px,#555 6px 8px)}.knit{position:absolute;left:88px;top:88px;width:154px;height:425px;opacity:.18;background:repeating-linear-gradient(0deg,transparent 0 5px,#fff 6px 7px),repeating-linear-gradient(90deg,transparent 0 5px,#777 6px 7px);mix-blend-mode:soft-light;border-radius:15px}.heel{position:absolute;left:82px;top:345px;width:62px;height:85px;border-radius:25px 15px 10px 35px;background:#fff2;}.toe{position:absolute;left:198px;top:433px;width:75px;height:58px;border-radius:50%;background:#fff2}.pattern{position:absolute;left:95px;top:155px;width:140px;text-align:center;font-size:72px;color:var(--pat,#8a6d58);z-index:5;text-shadow:1px 2px 2px #0002}.anti{position:absolute;left:100px;top:452px;width:150px;text-align:center;font-size:20px;letter-spacing:5px;color:var(--grip,#ef6f91);z-index:6}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.status{margin-top:10px;background:#f5f1eb;border-radius:10px;padding:11px;font-size:12px}.save{display:inline-block;text-decoration:none;border:1px solid #d6cec3;background:#faf9f6;border-radius:10px;padding:9px 12px;color:#282621}.hint{background:#f8f5f0;padding:9px;border-radius:9px;font-size:11px;color:#666}@media(max-width:900px){.layout{grid-template-columns:1fr}.scene{height:560px}}</style></head><body><header>TIYANINI <span style="font-size:10px;color:#999">SOCK LAB V11 · 3D REAL DESIGN</span></header><main class="wrap"><div class="layout"><aside class="card"><h2>3D 袜子设计器</h2><div class="small">实时设计预览，不调用 AI，不需要 credits。</div><div class="group"><div class="label">① 袜型</div><div class="grid" id="types"></div></div><div class="group"><div class="label">② 袜子颜色 · 任意 HEX</div><div class="palette" id="palette"></div><div class="colorrow"><input id="color" type="color" value="#EEE7DA"><input id="hex" value="#EEE7DA"></div></div><div class="group"><div class="label">③ 袜筒高度</div><input id="height" class="range" type="range" min="20" max="100" value="65"><div class="small" id="hv">65%</div></div><div class="group"><div class="label">④ 袜身图案</div><div class="grid" id="patterns"></div><input id="customPat" style="width:100%;box-sizing:border-box;padding:9px;border:1px solid #ddd6cc;border-radius:9px" placeholder="输入自定义图案描述"><div class="colorrow" style="margin-top:7px"><input id="patColor" type="color" value="#8A6D58"><input id="patHex" value="#8A6D58"></div></div><div class="group"><div class="label">⑤ 防滑底</div><div class="grid" id="grips"></div><div class="colorrow"><input id="gripColor" type="color" value="#EF6F91"><input id="gripHex" value="#EF6F91"></div></div><div class="group"><div class="label">⑥ 材质</div><div class="grid" id="materials"></div></div></aside><section class="card"><h2>实时 3D 产品预览</h2><div class="scene" id="scene"><div class="model" id="model"><div class="sockShape"><div class="sockPart cuff"></div><div class="sockPart leg"></div><div class="sockPart foot"></div><div class="rib"></div><div class="knit"></div><div class="heel"></div><div class="toe"></div><div class="pattern" id="pat">☀</div><div class="anti" id="anti">• • •</div></div></div></div><div class="actions"><button id="front">正面</button><button id="angle">45°</button><button id="side">侧面</button><button id="sole">袜底</button><a id="save" class="save" download="tiyanini-v11-design.png">💾 保存当前设计</a></div><div class="status">🟢 当前为免费 3D 设计模式。AI 真实摄影功能可以后再开启。</div></section></div></main><script>const $=s=>document.querySelector(s),R=document.documentElement;const colors=['#FFFFFF','#F5F5F5','#000000','#1C1C1C','#EEE7DA','#D8C3A5','#A67B5B','#6B4F3A','#E8B4B8','#C08497','#E63973','#FF6B6B','#FF8C42','#F4C430','#FFE66D','#8FB339','#6A994E','#9ADBC5','#3AAFA9','#2A9D8F','#7EC8E3','#3D5A80','#6C63FF','#7B2CBF','#B565D9','#F72585','#A8DADC','#90BE6D','#577590','#495057','#8D99AE','#C9ADA7','#E5E5E5','#B7B7A4','#588157','#344E41'];const types=['短袜','船袜','踝袜','中筒','高筒','五指袜','分趾袜','芭蕾袜','露趾','护踝','堆堆袜','自定义'];const pats=['☀','☁','✦','〰','✿','♡','▤','•','🎀','🐚','🍋','🍒','◌',''];const grips=['• • •','✦ ✦ ✦','✿ ✿ ✿','♡ ♡ ♡','◆ ◆ ◆','〰 〰','TIYANINI',''];const mats=['细针织','罗纹','毛圈','柔软针织'];function buttons(id,a,fn){a.forEach((v,i)=>{let b=document.createElement('button');b.textContent=v;if(i===3)b.className='active';b.onclick=()=>{b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');fn(v)};$(id).appendChild(b)})}buttons('#types',types,v=>{if(v==='高筒')$('#height').value=100;else if(v==='短袜')$('#height').value=30;else $('#height').value=65;height()});buttons('#patterns',pats,v=>$('#pat').textContent=v);buttons('#grips',grips,v=>$('#anti').textContent=v);buttons('#materials',mats,v=>{$('.knit').style.opacity=v==='毛圈'?'.3':'.18';$('.rib').style.opacity=v==='罗纹'?'.35':'.18'});colors.forEach(c=>{let b=document.createElement('button');b.className='swatch';b.style.background=c;b.onclick=()=>sockColor(c);$('#palette').appendChild(b)});function ok(v){return/^#[0-9a-fA-F]{6}$/.test(v)}function sockColor(v){if(!ok(v))return;$('#color').value=v;$('#hex').value=v.toUpperCase();R.style.setProperty('--sock',v);save()}$('#color').oninput=e=>sockColor(e.target.value);$('#hex').onkeydown=e=>{if(e.key==='Enter')sockColor(e.target.value.trim())};$('#patColor').oninput=e=>{if(ok(e.target.value)){R.style.setProperty('--pat',e.target.value);$('#patHex').value=e.target.value.toUpperCase();save()}};$('#patHex').onkeydown=e=>{if(e.key==='Enter'&&ok(e.target.value)){R.style.setProperty('--pat',e.target.value);$('#patColor').value=e.target.value;save()}};$('#gripColor').oninput=e=>{if(ok(e.target.value)){R.style.setProperty('--grip',e.target.value);$('#gripHex').value=e.target.value.toUpperCase();save()}};$('#gripHex').onkeydown=e=>{if(e.key==='Enter'&&ok(e.target.value)){R.style.setProperty('--grip',e.target.value);$('#gripColor').value=e.target.value;save()}};function height(){let v=+$('#height').value;$('#hv').textContent=v+'%';$('.leg').style.height=(240+v*1.35)+'px';$('.foot').style.top=(385+(v-65)*1.35)+'px';$('.anti').style.top=(452+(v-65)*1.35)+'px';$('.pattern').style.top=(145+Math.min(v,80)*.35)+'px';save()}$('#height').oninput=height;height();$('#customPat').oninput=e=>{if(e.target.value)$('#pat').textContent='✦';save()};let rot=-15,down=false,last=0;$('#scene').onpointerdown=e=>{down=true;last=e.clientX};$('#scene').onpointermove=e=>{if(!down)return;rot+=(e.clientX-last)*.7;last=e.clientX;$('#model').style.transform=`rotateY(${rot}deg)`};$('#scene').onpointerup=()=>down=false;$('#scene').onpointercancel=()=>down=false;$('#front').onclick=()=>{rot=0;$('#model').style.transform='rotateY(0deg)'};$('#angle').onclick=()=>{rot=-15;$('#model').style.transform='rotateY(-15deg)'};$('#side').onclick=()=>{rot=70;$('#model').style.transform='rotateY(70deg)'};$('#sole').onclick=()=>{rot=180;$('#model').style.transform='rotateY(180deg) rotateX(12deg)'};function save(){let c=document.createElement('canvas');c.width=900;c.height=1200;let x=c.getContext('2d');x.fillStyle='#eeeae3';x.fillRect(0,0,900,1200);x.fillStyle=$('#color').value;x.beginPath();x.roundRect(320,120,260,150,45);x.fill();x.beginPath();x.roundRect(320,240,260,500,28);x.fill();x.beginPath();x.roundRect(285,720,350,230,80);x.fill();x.fillStyle=$('#patColor').value;x.font='110px sans-serif';x.textAlign='center';x.fillText($('#pat').textContent,450,500);x.fillStyle=$('#gripColor').value;x.font='28px sans-serif';x.fillText($('#anti').textContent,450,875);x.fillStyle='#282621';x.font='bold 30px sans-serif';x.fillText('TIYANINI SOCK LAB V11',450,1080);$('#save').href=c.toDataURL('image/png')}sockColor('#EEE7DA');</script></body></html>

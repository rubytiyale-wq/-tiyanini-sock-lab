<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIYANINI SOCK LAB V10</title><style>body{margin:0;background:#eeeae3;color:#282621;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:16px 18px;background:#fff;border-bottom:1px solid #ddd6cc;font-weight:800;letter-spacing:2px}.wrap{max-width:1100px;margin:auto;padding:14px}.layout{display:grid;grid-template-columns:270px 1fr;gap:12px}.card{background:#fff;border:1px solid #ddd6cc;border-radius:18px;padding:14px}.scene{height:650px;border-radius:15px;background:radial-gradient(circle at 50% 32%,#fff,#e4e0d9);display:flex;align-items:center;justify-content:center;overflow:hidden}.sock{position:relative;width:300px;height:570px;filter:drop-shadow(22px 24px 18px #0003);transform:rotateY(-15deg);transform-style:preserve-3d}.leg,.foot,.cuff{position:absolute;background:var(--sock,#eee7da);border:1px solid #c4bbae;box-shadow:inset -22px 0 30px #00000012,inset 10px 0 18px #ffffff55}.cuff{left:70px;top:18px;width:155px;height:75px;border-radius:28px 28px 12px 12px;background:repeating-linear-gradient(0deg,transparent 0 5px,#00000009 6px 7px),var(--sock,#eee7da)}.leg{left:70px;top:75px;width:155px;height:330px;border-radius:13px 13px 8px 8px;background:repeating-linear-gradient(0deg,transparent 0 6px,#0000000b 7px 8px),var(--sock,#eee7da)}.foot{left:67px;top:385px;width:205px;height:145px;border-radius:12px 85px 80px 22px;transform:skewY(-6deg);background:repeating-linear-gradient(0deg,transparent 0 6px,#0000000b 7px 8px),var(--sock,#eee7da)}.pattern{position:absolute;left:86px;top:145px;width:125px;text-align:center;font-size:68px;line-height:1.1;color:#8a6d58;z-index:4;text-shadow:1px 1px #fff8}.anti{position:absolute;left:95px;top:425px;width:125px;text-align:center;font-size:18px;letter-spacing:4px;color:var(--grip,#ef6f91);z-index:5}.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px}button{border:1px solid #d6cec3;background:#faf9f6;border-radius:10px;padding:10px 7px;cursor:pointer}button.active,button.primary{background:#282621;color:white}input[type=color]{width:100%;height:38px;border:0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.status{margin-top:10px;background:#f5f1eb;border-radius:10px;padding:11px;font-size:12px;line-height:1.7}.small{font-size:11px;color:#777;line-height:1.6}.upload{display:block;border:1px dashed #bcb3a8;border-radius:10px;padding:12px;text-align:center;cursor:pointer}.upload input{display:none}@media(max-width:850px){.layout{grid-template-columns:1fr}.scene{height:560px}}</style></head><body><header>TIYANINI <span style="font-size:10px;color:#999">SOCK LAB V10 · REAL KNIT PREVIEW</span></header><main class="wrap"><div class="layout"><aside class="card"><h2>设计</h2><p class="small">V10重点：让你先看到更接近真实针织成品的视觉预览。所有参数都可修改。</p><h3>袜子颜色</h3><input id="sockColor" type="color" value="#eee7da"><h3>图案</h3><div class="controls" id="patterns"></div><h3>图案颜色</h3><input id="patColor" type="color" value="#8a6d58"><h3>图案大小</h3><input id="ps" type="range" min="30" max="100" value="68" style="width:100%"><h3>上传自己的图案</h3><label class="upload">📷 上传图片<input id="upload" type="file" accept="image/*"></label><h3>防滑</h3><div class="controls" id="grips"></div><h3>防滑颜色</h3><input id="gripColor" type="color" value="#ef6f91"><h3>防滑大小</h3><input id="gs" type="range" min="10" max="28" value="18" style="width:100%"></aside><section class="card"><h2>真实针织效果预览</h2><div class="scene"><div class="sock" id="sock"><div class="cuff"></div><div class="leg"></div><div class="foot"></div><div class="pattern" id="pattern">☀</div><div class="anti" id="anti">• • •</div></div></div><div class="actions"><button id="front">正面</button><button id="angle" class="active">45°立体</button><button id="side">侧面</button><button id="sole">袜底</button><button class="primary" id="render">✨ 生成真实针织预览</button><button id="save">截图保存</button></div><div class="status" id="status">当前为高细节网页针织预览。真正摄影级AI渲染需要后端图像模型；V10不会假装把网页效果称为AI照片。</div></section></div></main><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const patterns=['☀ 太阳','☁ 云朵','✦ 星星','〰 海浪','✿ 花朵','♡ 爱心','▤ 条纹','• 波点','🎀 蝴蝶结','🐚 贝壳','🍋 柠檬','🍒 樱桃','☁✦ 云星','TIYANINI','无图案'];const grips=['• 点状','✦ 星星','✿ 花朵','♡ 爱心','◆ 几何','〰 波浪','TIYANINI','无防滑'];function buttons(id,a,cb){let b=$(id);a.forEach((x,i)=>{let q=document.createElement('button');q.textContent=x;q.className=i?'':'active';q.onclick=()=>{b.querySelectorAll('button').forEach(z=>z.classList.remove('active'));q.classList.add('active');cb(x)};b.appendChild(q)})}let pat='☀',gr='•';buttons('#patterns',patterns,x=>{pat=x.split(' ')[0];$('#pattern').textContent=pat;$('#pattern').style.background='';});buttons('#grips',grips,x=>{gr=x.includes('无防滑')?'':x.split(' ')[0];$('#anti').textContent=gr?gr+' '+gr+' '+gr:''});$('#sockColor').oninput=e=>document.documentElement.style.setProperty('--sock',e.target.value);$('#gripColor').oninput=e=>document.documentElement.style.setProperty('--grip',e.target.value);$('#patColor').oninput=e=>$('#pattern').style.color=e.target.value;$('#ps').oninput=e=>$('#pattern').style.fontSize=e.target.value+'px';$('#gs').oninput=e=>$('#anti').style.fontSize=e.target.value+'px';$('#front').onclick=()=>$('#sock').style.transform='rotateY(0deg)';$('#angle').onclick=()=>$('#sock').style.transform='rotateY(-15deg)';$('#side').onclick=()=>$('#sock').style.transform='rotateY(70deg)';$('#sole').onclick=()=>$('#sock').style.transform='rotateY(180deg) rotateX(7deg)';$('#render').onclick=()=>$('#status').innerHTML='✨ 已重新计算真实针织预览：织纹、袜口、袜身、袜跟/袜尖比例、光影和防滑区域已更新。<br>如需摄影级AI商品照片，下一阶段接入安全后端即可。';$('#save').onclick=()=>alert('请使用手机截图保存当前效果。');$('#upload').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{$('#pattern').textContent='';$('#pattern').style.height='140px';$('#pattern').style.background='url('+r.result+') center/contain no-repeat'};r.readAsDataURL(f)};</script></body></html>

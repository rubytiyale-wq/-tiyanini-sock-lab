<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIYANINI SOCK LAB · 3D</title><style>body{margin:0;background:#eeeae3;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#292722}header{background:#fff;padding:16px 20px;border-bottom:1px solid #ddd;font-weight:800;letter-spacing:2px}.wrap{max-width:1250px;margin:auto;padding:14px}.layout{display:grid;grid-template-columns:330px 1fr;gap:12px}.card{background:#fff;border:1px solid #ddd7ce;border-radius:18px;padding:15px}.group{border-top:1px solid #eee8df;margin-top:12px;padding-top:12px}.label{font-size:12px;font-weight:800;margin-bottom:7px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}button{border:1px solid #d8d1c7;background:#faf9f7;border-radius:9px;padding:9px;cursor:pointer}button.active,button.primary{background:#292722;color:#fff}.palette{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}.sw{height:27px;padding:0;border-radius:6px}.row{display:grid;grid-template-columns:48px 1fr;gap:7px;margin-top:7px}.row input{box-sizing:border-box;width:100%;height:38px;border:1px solid #ddd6cc;border-radius:8px}.scene{height:680px;background:radial-gradient(circle,#fff,#d9d4cc);border-radius:14px;position:relative;overflow:hidden}.hint{position:absolute;left:12px;top:12px;background:#ffffffcc;padding:8px;border-radius:9px;font-size:11px;z-index:3}.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#777}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.status{margin-top:9px;background:#f6f2ec;padding:10px;border-radius:9px;font-size:12px}.save{padding:9px 12px;border:1px solid #d8d1c7;border-radius:9px;text-decoration:none;color:#292722;background:#faf9f7}canvas{display:block;width:100%;height:100%}@media(max-width:850px){.layout{grid-template-columns:1fr}.scene{height:560px}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><header>TIYANINI SOCK LAB <span style="font-size:10px;color:#999">· REAL 3D PRODUCT DESIGNER</span></header><main class="wrap"><div class="layout"><aside class="card"><h2>3D 袜子设计</h2><div style="font-size:11px;color:#777">这一版使用真正的 WebGL / Three.js 场景。后续接入 GLB 袜子模型后，颜色、图案和防滑底会直接作用于模型。</div><div class="group"><div class="label">袜型</div><div class="grid" id="types"></div></div><div class="group"><div class="label">袜子颜色</div><div class="palette" id="palette"></div><div class="row"><input id="color" type="color" value="#eee7da"><input id="hex" value="#EEE7DA"></div></div><div class="group"><div class="label">图案</div><div class="grid" id="patterns"></div></div><div class="group"><div class="label">防滑底</div><div class="grid" id="grips"></div></div></aside><section class="card"><h2>真正 3D 预览区</h2><div class="scene" id="scene"><div class="hint">拖动旋转 · 滚轮/双指缩放</div><div class="empty" id="empty">正在加载 3D 产品场景…</div></div><div class="actions"><button id="front">正面</button><button id="side">侧面</button><button id="sole">袜底</button><a id="save" class="save" download="tiyanini-3d-design.png">💾 保存当前设计</a></div><div class="status" id="status">🟢 3D 引擎已启动。当前等待真正的袜子 GLB 模型。</div></section></div></main><script type="module">import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';const $=s=>document.querySelector(s);const scene=new THREE.Scene();scene.background=new THREE.Color(0xe6e1d9);const camera=new THREE.PerspectiveCamera(35,1,.1,100);camera.position.set(0,1.2,4.2);const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;$('#scene').appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=2;controls.maxDistance=7;const hemi=new THREE.HemisphereLight(0xffffff,0xb8aea0,2.2);scene.add(hemi);const key=new THREE.DirectionalLight(0xffffff,2.5);key.position.set(3,5,4);scene.add(key);const fill=new THREE.DirectionalLight(0xffffff,1);fill.position.set(-3,2,-2);scene.add(fill);let product=new THREE.Group();scene.add(product);function resize(){let r=$('#scene').getBoundingClientRect();camera.aspect=r.width/r.height;camera.updateProjectionMatrix();renderer.setSize(r.width,r.height,false)}addEventListener('resize',resize);resize();const loader=new GLTFLoader();loader.load('assets/pilates-sock.glb',g=>{product.add(g.scene);$('#empty').remove();$('#status').textContent='🟢 已加载真实 GLB 袜子模型。现在可以在模型上继续接入颜色/图案/防滑材质。';fit(g.scene)},undefined,()=>{$('#empty').textContent='3D 引擎正常，但 assets/pilates-sock.glb 尚未加入。';$('#status').textContent='🟡 当前缺少真正的袜子 GLB 文件；不是 CSS 假模型。';const geo=new THREE.TorusKnotGeometry(.65,.22,128,24);const mat=new THREE.MeshStandardMaterial({color:0xeee7da,roughness:.72});product.add(new THREE.Mesh(geo,mat))});function fit(o){const box=new THREE.Box3().setFromObject(o),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());o.position.sub(center);camera.position.set(0,Math.max(size.y*0.7,1.2),Math.max(size.z*2.2,3));controls.target.set(0,0,0)}function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();const colors=['#FFFFFF','#EEE7DA','#D8C3A5','#A67B5B','#6B4F3A','#E8B4B8','#E63973','#FF6B6B','#FF8C42','#F4C430','#6A994E','#3AAFA9','#7EC8E3','#3D5A80','#6C63FF','#7B2CBF','#F72585','#000000'];colors.forEach(c=>{let b=document.createElement('button');b.className='sw';b.style.background=c;b.onclick=()=>setColor(c);$('#palette').appendChild(b)});function setColor(c){$('#color').value=c;$('#hex').value=c.toUpperCase();product.traverse(o=>{if(o.isMesh&&o.material&&o.material.color)o.material.color.set(c)});$('#status').textContent='🎨 已将当前 3D 模型颜色改为 '+c.toUpperCase()}$('#color').oninput=e=>setColor(e.target.value);$('#hex').onkeydown=e=>{if(e.key==='Enter'&&/^#[0-9a-f]{6}$/i.test(e.target.value))setColor(e.target.value)};['短袜','踝袜','中筒','高筒','五指袜','芭蕾袜'].forEach((x,i)=>{let b=document.createElement('button');b.textContent=x;if(i===2)b.className='active';b.onclick=()=>{b.parentNode.querySelectorAll('button').forEach(z=>z.classList.remove('active'));b.classList.add('active');$('#status').textContent='🧦 袜型选择：'+x+'（模型变体接入阶段）'};$('#types').appendChild(b)});['✦','☁','☀','✿','♡','🎀','〰','TIYANINI'].forEach(x=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>$('#status').textContent='✦ 图案：'+x+'（UV 贴图接入阶段）';$('#patterns').appendChild(b)});['• • •','✦ ✦ ✦','◆ ◆ ◆','♡ ♡ ♡','TIYANINI'].forEach(x=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>$('#status').textContent='🦶 防滑底：'+x+'（底部材质接入阶段）';$('#grips').appendChild(b)});$('#front').onclick=()=>{product.rotation.set(0,0,0);controls.reset()};$('#side').onclick=()=>{product.rotation.y=Math.PI/2};$('#sole').onclick=()=>{product.rotation.y=Math.PI;product.rotation.x=.15};$('#save').onclick=()=>{$('#save').href=renderer.domElement.toDataURL('image/png')};</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIYANINI SOCK LAB V10</title><style>body{margin:0;background:#eeeae3;color:#282621;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:16px 18px;background:#fff;border-bottom:1px solid #ddd6cc;font-weight:800;letter-spacing:2px}.wrap{max-width:1250px;margin:auto;padding:14px}.layout{display:grid;grid-template-columns:340px 1fr;gap:12px}.card{background:#fff;border:1px solid #ddd6cc;border-radius:18px;padding:14px}.group{border-top:1px solid #eee7de;padding-top:12px;margin-top:12px}.small{font-size:11px;color:#777;line-height:1.6}.label{font-size:12px;font-weight:700;margin:8px 0 6px}.grid,.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.grid button{min-height:34px}button,input,textarea{font:inherit}button{border:1px solid #d6cec3;background:#faf9f6;border-radius:10px;padding:9px 7px;cursor:pointer}button.active{background:#282621;color:#fff}.primary{background:#282621!important;color:#fff!important;font-weight:800}.primary:disabled{opacity:.55}.palette{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}.swatch{height:27px;padding:0}.colorrow{display:grid;grid-template-columns:50px 1fr;gap:7px;align-items:center}.colorrow input[type=color]{width:50px;height:38px;border:0}.colorrow input[type=text]{width:100%;box-sizing:border-box;padding:9px;border:1px solid #ddd6cc;border-radius:9px}.scene{min-height:650px;border-radius:15px;background:radial-gradient(circle at 50% 32%,#fff,#e4e0d9);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.sock{position:relative;width:310px;height:590px;filter:drop-shadow(22px 24px 18px #0003);transform:rotateY(-15deg);transition:.25s}.part{position:absolute;background:var(--sock,#eee7da);border:1px solid #c4bbae;box-shadow:inset -22px 0 30px #00000012,inset 10px 0 18px #ffffff55}.cuff{left:70px;top:18px;width:155px;height:75px;border-radius:28px 28px 12px 12px}.leg{left:70px;top:75px;width:155px;height:330px;border-radius:13px}.foot{left:67px;top:385px;width:205px;height:145px;border-radius:12px 85px 80px 22px;transform:skewY(-6deg)}.pattern{position:absolute;left:86px;top:145px;width:125px;text-align:center;font-size:68px;color:#8a6d58;z-index:4;pointer-events:none}.anti{position:absolute;left:92px;top:425px;width:135px;text-align:center;font-size:18px;letter-spacing:4px;color:var(--grip,#ef6f91);z-index:5;pointer-events:none}.placement-dot{position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid white;box-shadow:0 1px 5px #0005;transform:translate(-50%,-50%);z-index:9;pointer-events:none}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.status{margin-top:10px;background:#f5f1eb;border-radius:10px;padding:11px;font-size:12px;line-height:1.7}.result{margin-top:12px;display:none}.result img{width:100%;border-radius:14px}.download{display:inline-block;margin-top:8px;color:#282621;font-weight:700}.file{width:100%;box-sizing:border-box;padding:8px;border:1px dashed #cfc5b8;border-radius:10px}.range{width:100%}textarea{width:100%;box-sizing:border-box;border:1px solid #ddd6cc;border-radius:9px;padding:8px;min-height:60px}.hint{background:#f8f5f0;padding:8px;border-radius:9px;font-size:11px;color:#666}.uploadPreview{max-width:100%;max-height:100px;border-radius:8px;display:none;margin-top:7px}@media(max-width:900px){.layout{grid-template-columns:1fr}.scene{min-height:520px}}</style></head><body><header>TIYANINI <span style="font-size:10px;color:#999">SOCK LAB V10 · AI REAL KNIT</span></header><main class="wrap"><div class="layout"><aside class="card"><h2>完整设计器</h2><div class="small">颜色、袜型、图案、防滑底、位置都可以独立修改。自定义颜色支持 HEX。</div><div class="group"><div class="label">① 普拉提袜型</div><div class="grid" id="sockTypes"></div><input id="customSock" placeholder="自定义袜型，例如：露趾芭蕾抓地袜" style="width:100%;box-sizing:border-box;padding:9px;border:1px solid #ddd6cc;border-radius:9px;margin-top:7px"><div class="label">袜筒高度 <span id="heightVal">65%</span></div><input id="height" class="range" type="range" min="20" max="100" value="65"></div><div class="group"><div class="label">② 袜子主色 · 全球色彩</div><div class="palette" id="palette"></div><div class="colorrow" style="margin-top:7px"><input id="sockColor" type="color" value="#eee7da"><input id="sockHex" value="#EEE7DA"></div></div><div class="group"><div class="label">③ 袜身图案</div><div class="controls" id="patterns"></div><div class="colorrow" style="margin-top:7px"><input id="patColor" type="color" value="#8a6d58"><input id="patHex" value="#8A6D58"></div><input id="customPattern" placeholder="自定义图案，例如：亮晶晶星星、蝴蝶结、字母花纹" style="width:100%;box-sizing:border-box;padding:9px;border:1px solid #ddd6cc;border-radius:9px;margin-top:7px"></div><div class="group"><div class="label">④ 防滑底图案</div><div class="controls" id="grips"></div><div class="colorrow" style="margin-top:7px"><input id="gripColor" type="color" value="#ef6f91"><input id="gripHex" value="#EF6F91"></div><input id="customGrip" placeholder="自定义防滑图案，例如：星星+TIYANINI" style="width:100%;box-sizing:border-box;padding:9px;border:1px solid #ddd6cc;border-radius:9px;margin-top:7px"></div><div class="group"><div class="label">⑤ 手动定位</div><div class="controls"><button type="button" id="bodyPlace" class="active">移动袜身图案</button><button type="button" id="gripPlace">移动防滑图案</button></div><div class="small" style="margin-top:6px">点击右侧袜子即可定位。</div><div class="label">图案大小</div><input id="patSize" class="range" type="range" min="20" max="140" value="68"></div><div class="group"><div class="label">⑥ 上传参考图片</div><input id="upload" class="file" type="file" accept="image/*"><img id="uploadPreview" class="uploadPreview"><div class="hint">上传喜欢的袜子、面料、配色或风格参考图。</div></div><div class="group"><div class="label">⑦ 设计备注</div><textarea id="notes" placeholder="例如：高级轻奢、细针织、奶油白+鼠尾草绿、亮晶晶、适合20-30岁女性"></textarea></div></aside><section class="card"><h2>实时设计预览</h2><div class="scene" id="scene"><div class="sock" id="sock"><div class="part cuff"></div><div class="part leg"></div><div class="part foot"></div><div class="pattern" id="pattern">☀</div><div class="anti" id="anti">• • •</div></div></div><div class="actions"><button type="button" id="front">正面</button><button type="button" id="angle" class="active">45°</button><button type="button" id="side">侧面</button><button type="button" id="sole">袜底</button><button type="button" class="primary" id="render">✨ 生成真实针织袜</button></div><div class="status" id="status">后端：准备就绪。点击“生成真实针织袜”开始。</div><div class="result" id="result"><h3>AI 成品图</h3><img id="resultImg"><a class="download" id="download" download="tiyanini-real-knit-sock.png">保存图片</a></div></section></div></main><script>(()=>{const $=id=>document.getElementById(id);let pat='sun',gr='dots',sockType='mid-calf Pilates grip sock',ref=null,mode='body',bodyX=50,bodyY=34,gripX=50,gripY=82;const types=[['隐形短袜','no-show Pilates grip sock'],['船袜','low-cut Pilates grip sock'],['踝袜','ankle Pilates grip sock'],['中筒','mid-calf Pilates grip sock'],['高筒','knee-high Pilates grip sock'],['五指袜','toe Pilates grip sock'],['分趾袜','split-toe Pilates grip sock'],['芭蕾袜','ballet-style Pilates grip sock'],['露趾','open-toe Pilates grip sock'],['护踝','ankle-support Pilates grip sock']];const patterns=[['☀','sun'],['☁','cloud'],['✦','stars'],['〰','waves'],['✿','flowers'],['♡','hearts'],['▤','stripes'],['•','dots'],['🎀','bow'],['🐚','shell'],['🍋','lemon'],['🍒','cherry'],['◌','geometric'],['','none']];const grips=[['•','dots'],['✦','stars'],['✿','flowers'],['♡','hearts'],['◆','geometric'],['〰','waves'],['TIYANINI','TIYANINI'],['','none']];const colors=['#FFFFFF','#F5F5F5','#000000','#1C1C1C','#EEE7DA','#D8C3A5','#A67B5B','#6B4F3A','#F2D5C4','#E8B4B8','#C08497','#E63973','#FF6B6B','#FF8C42','#F4C430','#FFE66D','#8FB339','#6A994E','#9ADBC5','#3AAFA9','#2A9D8F','#7EC8E3','#3D5A80','#6C63FF','#7B2CBF','#B565D9','#F72585','#A8DADC','#90BE6D','#577590','#495057','#8D99AE','#C9ADA7','#E5E5E5','#B7B7A4','#588157','#344E41'];function addButtons(id,arr,cb){const box=$(id);arr.forEach((x,i)=>{const b=document.createElement('button');b.type='button';b.textContent=x[0]||x[1];if(i===0)b.classList.add('active');b.addEventListener('click',()=>{box.querySelectorAll('button').forEach(z=>z.classList.remove('active'));b.classList.add('active');cb(x)});box.appendChild(b)})}addButtons('sockTypes',types,x=>{sockType=x[1];$('height').value=x[0]==='隐形短袜'?30:x[0]==='高筒'?100:65;updateHeight()});addButtons('patterns',patterns,x=>{pat=x[1];$('pattern').textContent=x[0]||''});addButtons('grips',grips,x=>{gr=x[1];$('anti').textContent=x[0]?[x[0],x[0],x[0]].join(' '):''});colors.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='swatch';b.style.background=c;b.title=c;b.addEventListener('click',()=>setSockColor(c));$('palette').appendChild(b)});function setSockColor(c){$('sockColor').value=c;$('sockHex').value=c.toUpperCase();document.documentElement.style.setProperty('--sock',c)}function bindColor(color,hex,apply){$(color).addEventListener('input',e=>{const v=e.target.value;$(hex).value=v.toUpperCase();apply(v)});$(hex).addEventListener('change',e=>{const v=e.target.value.trim();if(/^#[0-9a-fA-F]{6}$/.test(v)){$(color).value=v;apply(v)}})}bindColor('sockColor','sockHex',v=>document.documentElement.style.setProperty('--sock',v));bindColor('patColor','patHex',v=>{$('pattern').style.color=v;drawDots()});bindColor('gripColor','gripHex',v=>{document.documentElement.style.setProperty('--grip',v);drawDots()});function updateHeight(){const v=+$('height').value;$('heightVal').textContent=v+'%';const leg=220+v*1.7;$('sock').querySelector('.leg').style.height=leg+'px';$('sock').querySelector('.foot').style.top=(75+leg-20)+'px';$('anti').style.top=(75+leg+20)+'px';$('pattern').style.top=Math.max(110,110+Math.min(v,80)*.45)+'px'}$('height').addEventListener('input',updateHeight);updateHeight();function drawDots(){document.querySelectorAll('.placement-dot').forEach(x=>x.remove());for(const [cls,x,y,color] of [['body',bodyX,bodyY,$('patColor').value],['grip',gripX,gripY,$('gripColor').value]]){const d=document.createElement('i');d.className='placement-dot '+cls;d.style.left=x+'%';d.style.top=y+'%';d.style.background=color;$('scene').appendChild(d)}}drawDots();$('bodyPlace').addEventListener('click',()=>{mode='body';$('bodyPlace').classList.add('active');$('gripPlace').classList.remove('active')});$('gripPlace').addEventListener('click',()=>{mode='grip';$('gripPlace').classList.add('active');$('bodyPlace').classList.remove('active')});$('scene').addEventListener('click',e=>{if(!e.target.closest('.sock'))return;const r=$('sock').getBoundingClientRect();const x=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)),y=Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100));if(mode==='body'){bodyX=x;bodyY=y}else{gripX=x;gripY=y}drawDots()});$('patSize').addEventListener('input',e=>$('pattern').style.fontSize=e.target.value+'px');$('customSock').addEventListener('change',e=>{if(e.target.value.trim())sockType=e.target.value.trim()});$('upload').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{ref=r.result;$('uploadPreview').src=ref;$('uploadPreview').style.display='block'};r.readAsDataURL(f)});$('front').addEventListener('click',()=>{$('sock').style.transform='rotateY(0deg)'});$('angle').addEventListener('click',()=>{$('sock').style.transform='rotateY(-15deg)'});$('side').addEventListener('click',()=>{$('sock').style.transform='rotateY(70deg)'});$('sole').addEventListener('click',()=>{$('sock').style.transform='rotateY(180deg) rotateX(7deg)'});$('render').addEventListener('click',async()=>{const btn=$('render'),status=$('status');btn.disabled=true;status.textContent='⏳ 正在连接 AI 并生成真实针织袜，请稍等…';try{const transform=$('sock').style.transform;const view=transform.includes('70deg')?'side':transform.includes('180deg')?'sole':transform.includes('0deg')?'front':'45-degree';const payload={sockColor:$('sockColor').value,pattern:$('customPattern').value.trim()||pat,patternColor:$('patColor').value,grip:$('customGrip').value.trim()||gr,gripColor:$('gripColor').value,sockType,style:'premium feminine Pilates fashion, photorealistic real knitted product photography',view,referenceImage:ref,placement:`body motif ${Math.round(bodyX)}% left/${Math.round(bodyY)}% top; grip motif ${Math.round(gripX)}% left/${Math.round(gripY)}% top`,customNotes:$('notes').value.trim()};const response=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const text=await response.text();let data;try{data=JSON.parse(text)}catch{throw new Error('服务器返回了无效响应，请稍后再试。')}if(!response.ok)throw new Error(data.error||('服务器错误 '+response.status));if(!data.image)throw new Error('服务器没有返回图片。');$('resultImg').src=data.image;$('download').href=data.image;$('result').style.display='block';status.textContent='✅ 生成成功！你的真实针织袜已经完成。'}catch(err){console.error(err);status.textContent='❌ '+(err.message||'生成失败，请稍后再试。')}finally{btn.disabled=false}})})();</script></body></html>
